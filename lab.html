<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医学統計 計算ラボ</title>
<style>
  :root{--bg:#f3efe6;--paper:#fcfbf7;--ink:#20262a;--soft:#6c685c;--line:#ded7c7;--red:#9a3324;--teal:#2f5d62;--gold:#a8842c;--green:#3a6b4a;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",sans-serif;font-size:15px;line-height:1.7;}
  .wrap{max-width:640px;margin:0 auto;padding:18px 14px 60px;}
  .kicker{font-size:11px;letter-spacing:2px;color:var(--gold);}
  h1{font-family:Georgia,serif;font-size:25px;margin:2px 0 0;}
  .sub{font-size:13px;color:var(--soft);margin:3px 0 14px;}
  nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .tab{padding:8px 11px;font-size:13px;border-radius:8px;background:transparent;color:var(--soft);border:1px solid var(--line);cursor:pointer;}
  .tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:15px;margin:10px 0;}
  .ct{font-family:Georgia,serif;font-size:17px;}
  .cd{font-size:12px;color:var(--soft);margin:2px 0 8px;}
  .pill{padding:6px 12px;font-size:13px;border-radius:999px;background:#fff;color:var(--soft);border:1px solid var(--line);margin:0 5px 5px 0;cursor:pointer;}
  .pill.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  label.f{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0;color:var(--soft);}
  input[type=number]{width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;text-align:right;font-size:14px;}
  input.cell{width:100%;padding:6px;border:1px solid var(--line);border-radius:7px;text-align:center;font-size:14px;}
  .stat{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .stat .k{color:var(--soft);}
  .stat .v{font-family:ui-monospace,Menlo,monospace;}
  .hi .v{color:var(--red);font-weight:700;}
  .note{font-size:12.5px;color:var(--soft);margin-top:8px;}
  svg{display:block;width:100%;height:auto;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .g3{display:grid;grid-template-columns:auto 1fr 1fr;gap:5px;align-items:center;font-size:13px;text-align:center;}
  .choice{display:block;width:100%;text-align:left;padding:9px;margin:5px 0;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:14px;cursor:pointer;}
  .choice.ok{border-color:var(--green);background:rgba(58,107,74,.1);}
  .choice.ng{border-color:var(--red);background:rgba(154,51,36,.08);}
  .expl{margin-top:8px;padding:11px;border-radius:8px;background:rgba(168,132,44,.1);font-size:13.5px;}
  .reg div{padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .reg .h{display:flex;justify-content:space-between;}
  .reg .a{color:var(--teal);font-weight:600;}
  .reg .b{color:var(--soft);}
  .btn{padding:8px 14px;font-size:14px;border-radius:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;}
  footer{margin-top:24px;text-align:center;font-size:12px;color:var(--soft);}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">MEDICAL BIOSTATISTICS · LAB</div>
  <h1>医学統計 計算ラボ</h1>
  <p class="sub">触って確かめる ― 分布・検定・効果指標・生存・クイズ</p>
  <nav id="nav"></nav>
  <div id="view"></div>
  <footer>学習用。p値・分布は数値近似で算出（厳密な解析はR/統計ソフトで）。</footer>
</div>

<script>
const COL={ink:"#20262a",soft:"#6c685c",line:"#ded7c7",red:"#9a3324",teal:"#2f5d62",gold:"#a8842c",green:"#3a6b4a"};
/* ===== stats ===== */
function lnGamma(x){const g=7,c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];if(x<0.5)return Math.log(Math.PI/Math.sin(Math.PI*x))-lnGamma(1-x);x-=1;let a=c[0];const t=x+g+0.5;for(let i=1;i<g+2;i++)a+=c[i]/(x+i);return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a);}
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);const y=1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y;}
const normalCDF=z=>0.5*(1+erf(z/Math.SQRT2));
const normalPDF=(x,m=0,s=1)=>Math.exp(-((x-m)**2)/(2*s*s))/(s*Math.sqrt(2*Math.PI));
const tPDF=(x,df)=>Math.exp(lnGamma((df+1)/2)-lnGamma(df/2)-0.5*Math.log(df*Math.PI)-((df+1)/2)*Math.log(1+x*x/df));
const chiPDF=(x,df)=>x<=0?0:Math.exp((df/2-1)*Math.log(x)-x/2-(df/2)*Math.log(2)-lnGamma(df/2));
function upperTail(pdf,from,df,span=60,n=2000){const a=from,b=from+span,h=(b-a)/n;let s=pdf(a,df)+pdf(b,df);for(let i=1;i<n;i++)s+=(i%2?4:2)*pdf(a+i*h,df);return Math.max(0,Math.min(1,h/3*s));}
const tTwoTailP=(t,df)=>Math.min(1,2*upperTail(tPDF,Math.abs(t),df));
const chiUpperP=(c,df)=>upperTail(chiPDF,c,df);
const fmt=(x,d=3)=>isFinite(x)?(Math.abs(x)<0.001&&x!==0?x.toExponential(2):x.toFixed(d)):"—";
const $=id=>document.getElementById(id);
const stat=(k,v,hi)=>`<div class="stat ${hi?'hi':''}"><span class="k">${k}</span><span class="v">${v}</span></div>`;

/* ===== ① distribution explorer ===== */
function distPlot(dist,mu,sd,df,cut){
  const W=320,H=170,pad=24;let xmin,xmax,pdf;
  if(dist==='chi'){xmin=0;xmax=Math.max(30,df*3);pdf=x=>chiPDF(x,df);}
  else if(dist==='t'){xmin=-6;xmax=6;pdf=x=>tPDF(x,df);}
  else{xmin=mu-4*sd;xmax=mu+4*sd;pdf=x=>normalPDF(x,mu,sd);}
  const N=140,step=(xmax-xmin)/N,pts=[];let ymax=1e-9;
  for(let i=0;i<=N;i++){const x=xmin+i*step,y=pdf(x);pts.push([x,y]);if(y>ymax)ymax=y;}
  ymax*=1.12;
  const sx=v=>pad+(v-xmin)/(xmax-xmin)*(W-2*pad),sy=v=>H-pad-(v/ymax)*(H-2*pad);
  const d=pts.map((p,i)=>(i?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1)).join(' ');
  const shade=(lo,hi)=>{const seg=pts.filter(p=>p[0]>=lo&&p[0]<=hi);if(seg.length<2)return'';let s='M'+sx(seg[0][0]).toFixed(1)+' '+sy(0);seg.forEach(p=>s+=' L'+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1));s+=' L'+sx(seg[seg.length-1][0]).toFixed(1)+' '+sy(0)+' Z';return `<path d="${s}" fill="${COL.red}" opacity=".2"/>`;};
  let sh=dist==='chi'?shade(cut,xmax):shade(cut,xmax)+shade(xmin,dist==='normal'?2*mu-cut:-cut);
  const cx=sx(cut);
  return `<svg viewBox="0 0 ${W} ${H}">${sh}<path d="${d}" fill="none" stroke="${COL.teal}" stroke-width="1.8"/><line x1="${cx}" y1="${pad}" x2="${cx}" y2="${H-pad}" stroke="${COL.red}" stroke-dasharray="3 3"/><text x="${cx}" y="${pad-4}" font-size="9" fill="${COL.red}" text-anchor="middle">基準値</text></svg>`;
}
const dstate={dist:'normal',mu:0,sd:1,df:5,cut:1.96};
function renderDist(){
  const s=dstate;
  const tail=s.dist==='chi'?chiUpperP(s.cut,s.df):s.dist==='t'?tTwoTailP(s.cut,s.df):2*(1-normalCDF(Math.abs((s.cut-s.mu)/s.sd)));
  const params=s.dist==='normal'
    ?`<label class="f">平均 μ<input type="number" id="d_mu" value="${s.mu}" step="0.5"></label><label class="f">標準偏差 σ<input type="number" id="d_sd" value="${s.sd}" step="0.5" min="0.1"></label>`
    :`<label class="f">自由度 df<input type="number" id="d_df" value="${s.df}" step="1" min="1"></label>`;
  $('view').innerHTML=`<div class="card">
    <div class="ct">分布エクスプローラ</div><div class="cd">パラメータを動かし、裾の面積（≈p値）の意味を体感</div>
    <div style="margin-bottom:8px">${['normal:正規','t:t分布','chi:カイ二乗'].map(o=>{const[k,l]=o.split(':');return `<button class="pill ${s.dist===k?'on':''}" data-d="${k}">${l}</button>`}).join('')}</div>
    <div class="figwrap">${distPlot(s.dist,s.mu,s.sd,s.df,s.cut)}</div>
    <div class="grid2" style="margin-top:8px"><div>${params}<label class="f">基準値<input type="number" id="d_cut" value="${s.cut}" step="0.1"></label></div>
    <div>${stat(s.dist==='chi'?'上側確率':'両側裾確率(≈p)',fmt(tail,4),1)}${s.dist==='normal'?stat('z=(基準−μ)/σ',fmt((s.cut-s.mu)/s.sd,3)):''}</div></div>
    <div class="note">色付き部分＝「帰無仮説が正しいと仮定したとき、観測値以上に極端な値が出る確率」。これがp値の幾何学的イメージです。</div></div>`;
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{dstate.dist=b.dataset.d;renderDist();});
  const bind=(id,key)=>{const el=$(id);if(el)el.oninput=()=>{dstate[key]=parseFloat(el.value);renderDist();};};
  bind('d_mu','mu');bind('d_sd','sd');bind('d_df','df');bind('d_cut','cut');
}

/* ===== ② hypothesis tests ===== */
function renderTest(){
  $('view').innerHTML=`<div class="card"><div class="ct">独立2群 t検定</div><div class="cd">2群の平均値差（Welch・対応なし）</div>
    <div class="grid2">
      <div><div style="color:${COL.teal};font-size:12px">群1</div>
        <label class="f">平均<input type="number" id="m1" value="120"></label><label class="f">SD<input type="number" id="s1" value="15" min="0.1"></label><label class="f">n<input type="number" id="n1" value="30" min="2"></label></div>
      <div><div style="color:${COL.red};font-size:12px">群2</div>
        <label class="f">平均<input type="number" id="m2" value="112"></label><label class="f">SD<input type="number" id="s2" value="14" min="0.1"></label><label class="f">n<input type="number" id="n2" value="28" min="2"></label></div>
    </div><div id="tout" style="margin-top:8px"></div></div>
    <div class="card"><div class="ct">2×2分割表 / EBM指標</div><div class="cd">χ²検定とリスク指標（RR・OR・ARR・NNT）</div>
    <div class="g3"><div></div><div style="color:${COL.soft}">結果+</div><div style="color:${COL.soft}">結果−</div>
      <div style="color:${COL.teal};text-align:right;padding-right:4px">群1</div><input class="cell" id="a" value="30"><input class="cell" id="b" value="70">
      <div style="color:${COL.red};text-align:right;padding-right:4px">群2</div><input class="cell" id="c" value="50"><input class="cell" id="d" value="50"></div>
    <div id="xout" style="margin-top:8px"></div></div>`;
  function tcalc(){
    const m1=+$('m1').value,s1=+$('s1').value,n1=+$('n1').value,m2=+$('m2').value,s2=+$('s2').value,n2=+$('n2').value;
    const se=Math.sqrt(s1*s1/n1+s2*s2/n2),t=(m1-m2)/se;
    const df=Math.pow(s1*s1/n1+s2*s2/n2,2)/(Math.pow(s1*s1/n1,2)/(n1-1)+Math.pow(s2*s2/n2,2)/(n2-1));
    const p=tTwoTailP(t,df),lo=(m1-m2)-1.96*se,hi=(m1-m2)+1.96*se;
    const dd=(m1-m2)/Math.sqrt(((n1-1)*s1*s1+(n2-1)*s2*s2)/(n1+n2-2));
    $('tout').innerHTML=stat('平均差',fmt(m1-m2,2))+stat('t 統計量',fmt(t,3))+stat('自由度(Welch)',fmt(df,1))+stat('p 値(両側)',fmt(p,4),1)+stat('95%信頼区間',`[${fmt(lo,2)}, ${fmt(hi,2)}]`)+stat("Cohen's d",fmt(dd,3))+`<div class="note">判定: p ${p<0.05?'< 0.05 → 有意差あり':'≥ 0.05 → 有意差なし'}（α=0.05）。信頼区間が0を跨ぐかは p<0.05 と一致します。</div>`;
  }
  function xcalc(){
    const a=+$('a').value,b=+$('b').value,c=+$('c').value,d=+$('d').value,n=a+b+c+d;
    const E=[(a+b)*(a+c)/n,(a+b)*(b+d)/n,(c+d)*(a+c)/n,(c+d)*(b+d)/n],O=[a,b,c,d];
    const chi2=O.reduce((s,o,i)=>s+(o-E[i])**2/E[i],0),p=chiUpperP(chi2,1);
    const r1=a/(a+b),r2=c/(c+d),rr=r1/r2,or=(a*d)/(b*c),arr=r2-r1,nnt=1/Math.abs(arr);
    $('xout').innerHTML=stat('χ² (df=1)',fmt(chi2,3))+stat('p 値',fmt(p,4),1)+stat('相対リスク RR',fmt(rr,3))+stat('オッズ比 OR',fmt(or,3))+stat('絶対リスク減少 ARR',fmt(arr,3))+stat('治療必要数 NNT',isFinite(nnt)?Math.ceil(nnt):'—')+`<div class="note">期待度数5未満のセルがあるときはFisher正確検定を推奨。症例対照研究ではRRが使えずORを用います。</div>`;
  }
  ['m1','s1','n1','m2','s2','n2'].forEach(id=>$(id).oninput=tcalc);
  ['a','b','c','d'].forEach(id=>$(id).oninput=xcalc);
  tcalc();xcalc();
}

/* ===== ③ regression & survival ===== */
const survRaw=[[2,1,'A'],[4,1,'A'],[6,0,'A'],[8,1,'A'],[11,0,'A'],[14,1,'A'],[18,0,'A'],[22,1,'A'],[3,1,'B'],[5,0,'B'],[9,1,'B'],[12,0,'B'],[15,1,'B'],[20,0,'B'],[24,0,'B'],[26,1,'B']];
function km(g){const ev=survRaw.filter(r=>r[2]===g).sort((x,y)=>x[0]-y[0]);let at=ev.length,s=1;const pts=[[0,1]];ev.forEach(([t,e])=>{if(e===1){s*=(at-1)/at;pts.push([t,s]);}at--;});pts.push([26,s]);return pts;}
function kmPlot(){
  const W=320,H=170,pad=26,sx=v=>pad+v/27*(W-2*pad),sy=v=>H-pad-v*(H-2*pad);
  const step=a=>{let d='M'+sx(a[0][0])+' '+sy(a[0][1]);for(let i=1;i<a.length;i++)d+=' L'+sx(a[i][0])+' '+sy(a[i-1][1])+' L'+sx(a[i][0])+' '+sy(a[i][1]);return d;};
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="${COL.line}"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="${COL.line}"/>
   <path d="${step(km('A'))}" fill="none" stroke="${COL.teal}" stroke-width="2"/><path d="${step(km('B'))}" fill="none" stroke="${COL.red}" stroke-width="2"/>
   <text x="${W-pad}" y="${sy(.55)}" font-size="10" fill="${COL.teal}" text-anchor="end">群A</text><text x="${W-pad}" y="${sy(.2)+10}" font-size="10" fill="${COL.red}" text-anchor="end">群B</text>
   <text x="${sx(13)}" y="${H-8}" font-size="9" fill="${COL.soft}" text-anchor="middle">時間(月) →</text><text x="8" y="${pad}" font-size="9" fill="${COL.soft}">生存率</text></svg>`;
}
function renderRegSurv(){
  const reg=[['線形回帰','連続変数(例:血圧)','係数=1単位あたりの変化量'],['ロジスティック回帰','二値(発症あり/なし)','係数の指数=オッズ比'],['Cox回帰','イベントまでの時間','係数の指数=ハザード比'],['Poisson回帰','件数・率','係数の指数=率比']];
  $('view').innerHTML=`<div class="card"><div class="ct">Kaplan-Meier 生存曲線</div><div class="cd">打ち切りを考慮した生存率（プリセットデータから計算）</div>
    ${kmPlot()}<div class="note">階段が下がる点がイベント発生時点、横ばいは打ち切りのみ。2群差はlog-rank検定、ハザード比はCox回帰で評価します。</div></div>
    <div class="card"><div class="ct">回帰モデルの選び方</div><div class="cd">アウトカムの型でモデルが決まる</div>
    <div class="reg">${reg.map(r=>`<div><div class="h"><span class="a">${r[0]}</span><span class="b">${r[1]}</span></div><div class="b" style="font-size:12px">${r[2]}</div></div>`).join('')}</div>
    <div class="note">多変量解析は交絡調整が目的。投入する変数はイベント数の1/10程度(EPV10)が目安です。</div></div>`;
}

/* ===== ④ quiz ===== */
const QUIZ={basic:[
 {q:"p値の正しい説明は？",o:["帰無仮説が正しい確率","対立仮説が正しい確率","帰無仮説下で観測値以上に極端な結果が出る確率","効果の大きさ"],a:2,e:"p値は『帰無仮説が真と仮定したとき、観測データ以上に極端な結果が得られる確率』。仮説が正しい確率ではありません。"},
 {q:"正規分布で平均±2SDに含まれる割合は約？",o:["68%","95%","99.7%","50%"],a:1,e:"±1SD≈68%、±2SD≈95%、±3SD≈99.7%。"},
 {q:"外れ値が多いとき代表値として適切なのは？",o:["平均","中央値","最大値","合計"],a:1,e:"歪んだ分布や外れ値があるときは、影響を受けにくい中央値が実態を表します。"},
 {q:"差の95%信頼区間が0を含むとき、p値は？",o:["必ず<0.05","必ず≥0.05","判断できない","必ず=0.05"],a:1,e:"差の95%CIが0を跨ぐことと p≥0.05(両側α=0.05)は対応します。"}],
 adv:[
 {q:"第一種の過誤(α)とは？",o:["真の帰無仮説を棄却(偽陽性)","偽の帰無仮説を採択","効果量の過大評価","検出力不足"],a:0,e:"αエラー=偽陽性。βエラーは偽陰性で、検出力=1−β。"},
 {q:"多重比較で必要なのは？",o:["効果量を上げる","α水準の調整(Bonferroni等)","サンプルを減らす","片側検定にする"],a:1,e:"検定回数が増えると偽陽性が累積。Bonferroni・Holm・FDRなどで調整します。"},
 {q:"Cox回帰の主な前提は？",o:["イベントが正規分布","比例ハザード(HRが時間に依存しない)","打ち切りが無い","等分散"],a:1,e:"ハザード比が観察期間中ほぼ一定、という比例ハザード性が前提です。"},
 {q:"症例対照研究でRRでなくORを使う理由は？",o:["計算が簡単","発生率を直接推定できないから","ORの方が必ず大きい","盲検化のため"],a:1,e:"対照の選び方で曝露割合が決まるため、母集団の発生率(RR)を推定できません。"}]};
const qstate={mode:'basic',i:0,score:0,sel:null,done:false};
function renderQuiz(){
  const bank=QUIZ[qstate.mode];
  if(qstate.done){$('view').innerHTML=`<div class="card"><div class="ct">結果</div><p style="font-family:Georgia,serif;font-size:26px;color:${COL.red}">${qstate.score} / ${bank.length} 正解</p><button class="btn" id="q_again">もう一度</button></div>`;$('q_again').onclick=()=>{qstate.i=0;qstate.score=0;qstate.sel=null;qstate.done=false;renderQuiz();};return;}
  const cur=bank[qstate.i];
  $('view').innerHTML=`<div class="card">
    <div style="margin-bottom:8px">${['basic:基礎','adv:応用'].map(o=>{const[k,l]=o.split(':');return `<button class="pill ${qstate.mode===k?'on':''}" data-q="${k}">${l}</button>`}).join('')}</div>
    <div class="cd">${qstate.i+1} / ${bank.length}　現在 ${qstate.score}問正解</div>
    <p style="font-size:15px">${cur.q}</p><div id="qc"></div><div id="qe"></div></div>`;
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{qstate.mode=b.dataset.q;qstate.i=0;qstate.score=0;qstate.sel=null;qstate.done=false;renderQuiz();});
  const qc=$('qc');
  cur.o.forEach((o,k)=>{const btn=document.createElement('button');btn.className='choice';btn.textContent=o;
    btn.onclick=()=>{if(qstate.sel!==null)return;qstate.sel=k;if(k===cur.a)qstate.score++;
      qc.querySelectorAll('.choice').forEach((el,j)=>{if(j===cur.a)el.classList.add('ok');});if(k!==cur.a)btn.classList.add('ng');
      $('qe').innerHTML=`<div class="expl">${k===cur.a?'✓ 正解。':'✗ 不正解。'}${cur.e}<div style="margin-top:8px"><button class="btn" id="q_next">${qstate.i+1>=bank.length?'結果を見る':'次へ →'}</button></div></div>`;
      $('q_next').onclick=()=>{if(qstate.i+1>=bank.length){qstate.done=true;}else{qstate.i++;qstate.sel=null;}renderQuiz();};};
    qc.appendChild(btn);});
}

/* ===== shell ===== */
const TABS=[['dist','📈 分布',renderDist],['test','🧮 仮説検定',renderTest],['rs','📉 回帰・生存',renderRegSurv],['quiz','❓ クイズ',renderQuiz]];
let tab='dist';
function nav(){$('nav').innerHTML=TABS.map(t=>`<button class="tab ${tab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('');
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;if(tab==='quiz'){qstate.i=0;qstate.score=0;qstate.sel=null;qstate.done=false;}nav();TABS.find(t=>t[0]===tab)[2]();});}
nav();renderDist();
</script>
</body>
</html>
