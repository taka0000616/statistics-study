<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医学統計学 図解テキスト</title>
<style>
  :root{--bg:#f3efe6;--paper:#fcfbf7;--ink:#20262a;--soft:#6c685c;--line:#ded7c7;--red:#9a3324;--teal:#2f5d62;--gold:#a8842c;--green:#3a6b4a;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",sans-serif;font-size:16px;line-height:1.75;}
  .wrap{max-width:680px;margin:0 auto;padding:20px 16px 70px;}
  header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:16px;}
  .kicker{font-size:11px;letter-spacing:2px;color:var(--gold);}
  h1{font-family:Georgia,serif;font-size:27px;margin:2px 0 0;}
  .sub{font-size:13px;color:var(--soft);margin:4px 0 0;}
  nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
  .tab{padding:7px 10px;font-size:13px;border-radius:7px;background:transparent;color:var(--soft);border:1px solid var(--line);cursor:pointer;}
  .tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  h2{font-family:Georgia,serif;font-size:22px;margin:0 0 2px;}
  .uline{width:46px;height:4px;background:var(--red);margin-bottom:6px;border-radius:2px;}
  p{margin:14px 0;}
  .kw{color:var(--red);}
  .box{margin:18px 0;border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:9px;background:var(--paper);padding:14px 16px;}
  .box .bt{font-weight:700;font-size:14px;margin-bottom:4px;}
  .box .bb{font-size:14.5px;line-height:1.7;}
  figure{margin:20px 0;}
  .figbox{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;}
  figcaption{font-size:12px;color:var(--soft);margin-top:8px;padding-left:2px;}
  figcaption b{color:var(--red);}
  svg{display:block;width:100%;height:auto;}
  .rows>div{display:flex;gap:10px;padding:8px;border-radius:6px;background:rgba(0,0,0,.025);margin:5px 0;font-size:14px;}
  .rows .k{font-weight:700;flex:0 0 34%;}
  .pyr>div{margin:0 auto 4px;border-radius:5px;text-align:center;font-size:12px;padding:6px 4px;color:var(--ink);}
  .corr{display:flex;gap:6px;}
  .corr>div{flex:1;text-align:center;}
  .corr .lab{font-size:11px;color:var(--soft);margin-top:2px;}
  .navbtns{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding-top:14px;border-top:1px solid var(--line);}
  .navbtns button{background:none;border:none;color:var(--teal);font-size:14px;cursor:pointer;font-family:inherit;}
  .navbtns button:disabled{opacity:.3;}
  .pg{font-size:12px;color:var(--soft);}
  footer{margin-top:28px;text-align:center;font-size:12px;color:var(--soft);}
  .quiz{margin:22px 0 6px;border:1px solid var(--line);border-radius:11px;background:#eef0ea;padding:15px;}
  .quiz .qh{font-weight:700;font-size:15px;color:var(--teal);margin-bottom:4px;}
  .quiz .qsub{font-size:12px;color:var(--soft);margin-bottom:10px;}
  .qitem{margin:12px 0;}
  .qq{font-size:14.5px;font-weight:600;margin-bottom:6px;}
  .qq b{color:var(--red);}
  .choice{display:block;width:100%;text-align:left;padding:9px 11px;margin:5px 0;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink);line-height:1.5;}
  .choice.ok{border-color:var(--green);background:rgba(58,107,74,.1);}
  .choice.ng{border-color:var(--red);background:rgba(154,51,36,.08);}
  .qexpl{margin-top:7px;padding:11px;border-radius:8px;background:rgba(168,132,44,.12);font-size:13.5px;line-height:1.65;}
  .iact{margin:18px 0;border:1px solid var(--line);border-radius:11px;background:#eef2ee;padding:13px;}
  .iact-t{font-weight:700;font-size:14px;color:var(--green);margin-bottom:6px;}
  .ir{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--soft);}
  .ir input[type=range]{flex:1;accent-color:var(--teal);}
  .ip{margin-top:6px;font-family:ui-monospace,Menlo,monospace;font-size:15px;color:var(--red);font-weight:700;}
  .ihint{font-size:12px;color:var(--soft);margin-top:6px;}
  .nntrow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .nntrow label{font-size:13px;color:var(--soft);}
  .nntrow input{width:80px;padding:6px;border:1px solid var(--line);border-radius:7px;text-align:right;}
  .lk{cursor:pointer;border-bottom:1px dotted var(--red);}
  .lk:hover{background:rgba(154,51,36,.08);}
  .gsearch input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:15px;margin-bottom:10px;}
  .gitem{padding:10px 0;border-bottom:1px solid var(--line);}
  .gt{font-weight:700;color:var(--teal);font-size:15px;}
  .gd{font-size:14px;color:var(--ink);margin-top:2px;line-height:1.65;}
  .gflash{background:rgba(168,132,44,.18);border-radius:8px;padding:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">MEDICAL BIOSTATISTICS · TEXTBOOK</div>
    <h1>医学統計学 図解テキスト</h1>
    <p class="sub">図でつかむ、臨床研究のための統計（初学者向け・iPhone対応）</p>
  </header>
  <nav id="nav"></nav>
  <article id="art"></article>
  <div class="navbtns">
    <button id="prev">← 前の章</button>
    <span class="pg" id="pg"></span>
    <button id="next">次の章 →</button>
  </div>
  <footer>学習用テキスト。図中の数値・散布図は概念説明のためのイメージです。</footer>
</div>

<script>
const COL={ink:"#20262a",soft:"#6c685c",line:"#ded7c7",red:"#9a3324",teal:"#2f5d62",gold:"#a8842c",green:"#3a6b4a"};
const npdf=(x,m=0,s=1)=>Math.exp(-((x-m)**2)/(2*s*s))/(s*Math.sqrt(2*Math.PI));

/* ---- SVG helpers ---- */
function scaler(xd,yd,W,H,pad){const[x0,x1]=xd,[y0,y1]=yd;return{
  x:v=>pad+(v-x0)/(x1-x0)*(W-2*pad), y:v=>H-pad-(v-y0)/(y1-y0)*(H-2*pad)};}
function path(pts,sc){return pts.map((p,i)=>(i?"L":"M")+sc.x(p[0]).toFixed(1)+" "+sc.y(p[1]).toFixed(1)).join(" ");}

function fNormal(){
  const W=320,H=150,pad=22,sc=scaler([-4,4],[0,0.42],W,H,pad);
  const pts=[];for(let x=-4;x<=4;x+=0.1)pts.push([x,npdf(x)]);
  const band=(a,b,o)=>`<rect x="${sc.x(a)}" y="${pad}" width="${sc.x(b)-sc.x(a)}" height="${H-2*pad}" fill="${COL.teal}" opacity="${o}"/>`;
  let ticks="";[-3,-2,-1,0,1,2,3].forEach(t=>{ticks+=`<text x="${sc.x(t)}" y="${H-6}" font-size="9" fill="${COL.soft}" text-anchor="middle">${t===0?"中心":(t>0?"+":"")+t}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}">${band(-1,1,.28)}${band(-2,-1,.16)}${band(1,2,.16)}${band(-3,-2,.07)}${band(2,3,.07)}<path d="${path(pts,sc)}" fill="none" stroke="${COL.ink}" stroke-width="1.6"/>${ticks}</svg>`;
}
function fError(){
  const W=320,H=160,pad=20,sc=scaler([-4,8],[0,0.42],W,H,pad);
  const a=[],b=[];for(let x=-4;x<=8;x+=0.15){a.push([x,npdf(x,0,1)]);b.push([x,npdf(x,3,1)]);}
  const cx=sc.x(1.96);
  return `<svg viewBox="0 0 ${W} ${H}">
    <rect x="${cx}" y="${pad}" width="${W-pad-cx}" height="${H-2*pad}" fill="${COL.red}" opacity=".22"/>
    <rect x="${pad}" y="${pad}" width="${cx-pad}" height="${H-2*pad}" fill="${COL.gold}" opacity=".14"/>
    <path d="${path(a,sc)}" fill="none" stroke="${COL.teal}" stroke-width="1.6"/>
    <path d="${path(b,sc)}" fill="none" stroke="${COL.red}" stroke-width="1.6"/>
    <line x1="${cx}" y1="${pad}" x2="${cx}" y2="${H-pad}" stroke="${COL.ink}" stroke-dasharray="4 3"/>
    <text x="${cx}" y="${pad-4}" font-size="9" fill="${COL.ink}" text-anchor="middle">境界線</text>
    <text x="${sc.x(0)}" y="${H-6}" font-size="9" fill="${COL.soft}" text-anchor="middle">差がない世界</text>
    <text x="${sc.x(3)}" y="${H-6}" font-size="9" fill="${COL.soft}" text-anchor="middle">差がある世界</text></svg>`;
}
function fCI(){
  const data=[[4.8,1],[5.4,1],[3.9,1],[6.1,0],[5.0,1],[4.2,1],[5.7,1],[4.6,1],[3.7,0],[5.1,1]];
  let bars="";data.forEach((d,i)=>{const y=26+i*14,x=d[0]*40,w=26,c=d[1]?COL.teal:COL.red;
    bars+=`<line x1="${x-w}" y1="${y}" x2="${x+w}" y2="${y}" stroke="${c}" stroke-width="2"/><line x1="${x-w}" y1="${y-3}" x2="${x-w}" y2="${y+3}" stroke="${c}" stroke-width="2"/><line x1="${x+w}" y1="${y-3}" x2="${x+w}" y2="${y+3}" stroke="${c}" stroke-width="2"/><circle cx="${x}" cy="${y}" r="2.5" fill="${c}"/>`;});
  return `<svg viewBox="0 0 320 180"><line x1="200" y1="10" x2="200" y2="172" stroke="${COL.green}" stroke-dasharray="4 3"/><text x="204" y="18" font-size="9" fill="${COL.green}">本当の値</text>${bars}</svg>`;
}
function fFlow(){
  const node=(x,y,w,t,f)=>`<rect x="${x}" y="${y}" width="${w}" height="30" rx="6" fill="${f}" stroke="${COL.line}"/><text x="${x+w/2}" y="${y+19}" font-size="10" fill="${COL.ink}" text-anchor="middle">${t}</text>`;
  const arr=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${COL.soft}" stroke-width="1.2" marker-end="url(#ar)"/>`;
  return `<svg viewBox="0 0 340 262"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="${COL.soft}"/></marker></defs>
   ${node(108,6,124,"何を測っている？","#efeadc")}${arr(140,36,70,60)}${arr(200,36,272,60)}
   <text x="86" y="52" font-size="9" fill="${COL.soft}">量</text><text x="246" y="52" font-size="9" fill="${COL.soft}">種類分け</text>
   ${node(18,62,112,"グループ数は？","#e6efe9")}${node(232,62,100,"カイ二乗検定","#f3e6e2")}
   ${arr(50,92,50,116)}${arr(106,92,152,116)}<text x="26" y="108" font-size="9" fill="${COL.soft}">2つ</text><text x="120" y="108" font-size="9" fill="${COL.soft}">3つ+</text>
   ${node(8,118,86,"t検定","#dde8ec")}${node(112,118,96,"分散分析","#dde8ec")}
   ${arr(50,148,50,174)}${node(8,176,116,"順位で比べる検定","#efeadc")}${arr(160,148,160,174)}${node(116,176,116,"順位で比べる検定","#efeadc")}</svg>`;
}
function fCorr(){
  const W=110,H=100,pad=8,sc=scaler([0,10],[-2,14],W,H,pad);
  const mk=(r,col)=>{let dots="";for(let i=0;i<34;i++){const x=Math.random()*10,n=(Math.random()-0.5)*10*(1-Math.abs(r)),y=r*x+5+n;dots+=`<circle cx="${sc.x(x).toFixed(1)}" cy="${sc.y(y).toFixed(1)}" r="2.4" fill="${col}" opacity=".7"/>`;}return `<svg viewBox="0 0 ${W} ${H}"><rect x="${pad}" y="${pad}" width="${W-2*pad}" height="${H-2*pad}" fill="none" stroke="${COL.line}"/>${dots}</svg>`;};
  return `<div class="corr"><div>${mk(0.9,COL.teal)}<div class="lab">強い正の関係</div></div><div>${mk(0.3,COL.gold)}<div class="lab">弱い関係</div></div><div>${mk(-0.8,COL.red)}<div class="lab">負の関係</div></div></div>`;
}
function fKM(){
  const W=320,H=150,pad=24,sc=scaler([0,27],[0,1],W,H,pad);
  const A=[[0,1],[3,.92],[6,.88],[9,.8],[12,.75],[16,.68],[22,.6],[26,.55]];
  const B=[[0,1],[3,.88],[6,.75],[9,.6],[12,.48],[16,.35],[22,.28],[26,.2]];
  const step=a=>{let d="M"+sc.x(a[0][0])+" "+sc.y(a[0][1]);for(let i=1;i<a.length;i++){d+=" L"+sc.x(a[i][0])+" "+sc.y(a[i-1][1])+" L"+sc.x(a[i][0])+" "+sc.y(a[i][1]);}return d;};
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="${COL.line}"/>
    <path d="${step(A)}" fill="none" stroke="${COL.teal}" stroke-width="2"/><path d="${step(B)}" fill="none" stroke="${COL.red}" stroke-width="2"/>
    <text x="${W-pad}" y="${sc.y(.55)-4}" font-size="10" fill="${COL.teal}" text-anchor="end">治療群</text>
    <text x="${W-pad}" y="${sc.y(.2)+12}" font-size="10" fill="${COL.red}" text-anchor="end">対照群</text>
    <text x="${pad}" y="${H-6}" font-size="9" fill="${COL.soft}">経過した時間 →</text></svg>`;
}
function fPower(){
  const W=320,H=150,pad=26,sc=scaler([0,200],[0,1],W,H,pad);
  const pts=[];for(let n=4;n<=200;n+=4)pts.push([n,Math.min(.99,1-Math.exp(-n/45))]);
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${sc.y(.8)}" x2="${W-pad}" y2="${sc.y(.8)}" stroke="${COL.red}" stroke-dasharray="4 3"/>
    <text x="${W-pad}" y="${sc.y(.8)-4}" font-size="9" fill="${COL.red}" text-anchor="end">目標(8割)</text>
    <path d="${path(pts,sc)}" fill="none" stroke="${COL.teal}" stroke-width="2"/>
    <text x="${sc.x(100)}" y="${H-6}" font-size="9" fill="${COL.soft}" text-anchor="middle">人数 →</text>
    <text x="10" y="${pad}" font-size="9" fill="${COL.soft}">力</text></svg>`;
}
function fROC(){
  const W=300,H=150,pad=26,sc=scaler([0,1],[0,1],W,H,pad);
  const pts=[[0,0]];for(let i=1;i<=20;i++){const x=i/20;pts.push([x,Math.pow(x,.35)]);}
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${sc.x(0)}" y1="${sc.y(0)}" x2="${sc.x(1)}" y2="${sc.y(1)}" stroke="${COL.soft}" stroke-dasharray="4 3"/>
    <path d="${path(pts,sc)}" fill="none" stroke="${COL.teal}" stroke-width="2.2"/>
    <text x="${sc.x(.5)}" y="${H-6}" font-size="9" fill="${COL.soft}" text-anchor="middle">巻き込み(偽陽性) →</text>
    <text x="10" y="${pad}" font-size="9" fill="${COL.soft}">拾い上げ</text></svg>`;
}
function fMulti(){
  const W=320,H=150,pad=26,n=20,sc=scaler([0,n+1],[0,80],W,H,pad),bw=(W-2*pad)/n*0.7;
  let bars="";for(let k=1;k<=n;k++){const v=(1-Math.pow(0.95,k))*100,x=sc.x(k)-bw/2,y=sc.y(v);
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${H-pad-y}" fill="${COL.red}" opacity=".75"/>`;}
  return `<svg viewBox="0 0 ${W} ${H}">${bars}<text x="${sc.x(10)}" y="${H-6}" font-size="9" fill="${COL.soft}" text-anchor="middle">検定の回数 →</text><text x="8" y="${pad}" font-size="9" fill="${COL.soft}">偽陽性%</text></svg>`;
}
function fBayes(){
  const W=320,H=120,pad=14,lab=96,sc={x:v=>lab+v/100*(W-lab-30)};
  const bar=(y,v,c,t)=>`<text x="${pad}" y="${y+14}" font-size="11" fill="${COL.ink}">${t}</text><rect x="${lab}" y="${y}" width="${sc.x(v)-lab}" height="20" rx="4" fill="${c}"/><text x="${sc.x(v)+4}" y="${y+15}" font-size="11" fill="${COL.soft}">${v}%</text>`;
  return `<svg viewBox="0 0 ${W} ${H}">${bar(26,10,COL.soft,"検査前")}${bar(66,64,COL.teal,"陽性後")}</svg>`;
}
function pyramid(rows){return `<div class="pyr">`+rows.map((r,i)=>`<div style="width:${r[1]*100}%;background:rgba(154,51,36,${0.15+i*0.02})">${r[0]}</div>`).join("")+`</div>`;}
function fConfound(){
  const W=320,H=150;
  const node=(x,y,t,c)=>`<rect x="${x-52}" y="${y-15}" width="104" height="30" rx="6" fill="#fff" stroke="${c}" stroke-width="1.5"/><text x="${x}" y="${y+4}" font-size="10.5" fill="${COL.ink}" text-anchor="middle">${t}</text>`;
  const arr=(x1,y1,x2,y2,dash)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${COL.soft}" stroke-width="1.4" ${dash?'stroke-dasharray="4 3"':''} marker-end="url(#cf)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}"><defs><marker id="cf" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="${COL.soft}"/></marker></defs>
   ${node(160,26,"交絡因子(例:年齢)",COL.gold)}
   ${node(72,118,"原因とされるもの",COL.teal)}
   ${node(248,118,"結果",COL.red)}
   ${arr(138,38,92,104)}${arr(182,38,236,104)}${arr(124,118,196,118,true)}
   <text x="160" y="136" font-size="9" fill="${COL.soft}" text-anchor="middle">見かけの関係かも?</text></svg>`;
}
function fLogistic(){
  const W=320,H=150,pad=24,sc=scaler([-6,6],[0,1],W,H,pad);
  const pts=[];for(let x=-6;x<=6;x+=0.2)pts.push([x,1/(1+Math.exp(-x))]);
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${sc.y(0.5)}" x2="${W-pad}" y2="${sc.y(0.5)}" stroke="${COL.line}" stroke-dasharray="3 3"/>
   <path d="${path(pts,sc)}" fill="none" stroke="${COL.teal}" stroke-width="2.2"/>
   <text x="${pad}" y="${H-6}" font-size="9" fill="${COL.soft}">要因(リスクの強さ) →</text>
   <text x="8" y="${pad}" font-size="9" fill="${COL.soft}">発症の確率</text>
   <text x="${W-pad}" y="${sc.y(0.96)}" font-size="9" fill="${COL.soft}" text-anchor="end">1(必ず起こる)</text></svg>`;
}
function fForest(){
  const W=320,padR=12,top=12;
  const studies=[["研究A",0.80,0.60,1.06],["研究B",0.70,0.50,0.98],["研究C",0.92,0.72,1.18],["研究D",0.62,0.44,0.88]];
  const pooled=["統合(全部まとめて)",0.75,0.65,0.87];
  const x0=Math.log(0.4),x1=Math.log(1.7),plotL=118,plotR=W-padR;
  const sx=v=>plotL+(Math.log(v)-x0)/(x1-x0)*(plotR-plotL);
  let rows="",y=top+16;
  studies.forEach(s=>{rows+=`<text x="8" y="${y+4}" font-size="10" fill="${COL.ink}">${s[0]}</text>`+
    `<line x1="${sx(s[2])}" y1="${y}" x2="${sx(s[3])}" y2="${y}" stroke="${COL.teal}" stroke-width="1.6"/>`+
    `<rect x="${sx(s[1])-3}" y="${y-3}" width="6" height="6" fill="${COL.teal}"/>`;y+=24;});
  const cx=sx(pooled[1]),dl=sx(pooled[2]),dr=sx(pooled[3]);
  rows+=`<text x="8" y="${y+4}" font-size="10" fill="${COL.red}" font-weight="bold">${pooled[0]}</text>`+
    `<polygon points="${dl},${y} ${cx},${y-5} ${dr},${y} ${cx},${y+5}" fill="${COL.red}"/>`;
  const l1=sx(1);
  return `<svg viewBox="0 0 ${W} ${y+24}"><line x1="${l1}" y1="${top}" x2="${l1}" y2="${y+8}" stroke="${COL.soft}" stroke-dasharray="3 3"/>
   <text x="${l1}" y="${y+20}" font-size="9" fill="${COL.soft}" text-anchor="middle">1.0(差なし)</text>
   <text x="${plotL}" y="${top-2}" font-size="9" fill="${COL.green}">←効く</text>${rows}</svg>`;
}
function fITT(){
  const W=320,H=132,bar=(y,label,segs)=>{let x=118,s=`<text x="8" y="${y+15}" font-size="10" fill="${COL.ink}">${label}</text>`;
    segs.forEach(g=>{s+=`<rect x="${x}" y="${y}" width="${g[0]}" height="22" fill="${g[1]}" opacity="${g[3]||1}"/>`+(g[2]?`<text x="${x+g[0]/2}" y="${y+15}" font-size="9" fill="${g[4]||'#fff'}" text-anchor="middle">${g[2]}</text>`:"");x+=g[0];});return s;};
  return `<svg viewBox="0 0 ${W} ${H}">
   ${bar(18,"割付通り全員",[[184,COL.teal,"100人すべてを解析"]])}
   ${bar(54,"完遂者のみ",[[126,COL.gold,"70人のみ"],[58,COL.line,"脱落30人を除外",.6,COL.soft]])}
   <text x="8" y="100" font-size="10" fill="${COL.red}">脱落者を除くと「都合のよい人」だけ残り、</text>

function fManhattan(){
  const W=320,H=150,pad=22,sc=scaler([0,100],[0,9],W,H,pad);
  let dots="";for(let i=0;i<130;i++){const x=Math.random()*100;let y=Math.random()*2.6;
    if(Math.abs(x-30)<2.2)y=5.2+Math.random()*2.8;if(Math.abs(x-72)<2.2)y=5.6+Math.random()*2.6;
    const col=y>5?COL.red:(Math.floor(x/12)%2?COL.teal:COL.soft);
    dots+=`<circle cx="${sc.x(x).toFixed(1)}" cy="${sc.y(y).toFixed(1)}" r="2" fill="${col}" opacity=".75"/>`;}
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${sc.y(5)}" x2="${W-pad}" y2="${sc.y(5)}" stroke="${COL.red}" stroke-dasharray="4 3"/>
   <text x="${W-pad}" y="${sc.y(5)-3}" font-size="9" fill="${COL.red}" text-anchor="end">ゲノム全体の厳しい基準</text>${dots}
   <text x="${sc.x(50)}" y="${H-6}" font-size="9" fill="${COL.soft}" text-anchor="middle">染色体上の位置 →</text>
   <text x="6" y="${pad}" font-size="9" fill="${COL.soft}">関連の強さ</text></svg>`;
}
function fNonInf(){
  const W=320,plotL=66,plotR=300,top=16,x0=-3,x1=3,sx=v=>plotL+(v-x0)/(x1-x0)*(plotR-plotL);
  const zero=sx(0),marg=sx(-1.5);
  const bars=[["優越",1.2,0.4,2.0,COL.green],["非劣性",-0.3,-1.1,0.6,COL.teal],["判定不能",-1.0,-2.2,0.3,COL.gold],["劣る",-2.1,-2.8,-1.4,COL.red]];
  let rows="",y=top+24;bars.forEach(b=>{rows+=`<text x="6" y="${y+4}" font-size="10" fill="${b[4]}">${b[0]}</text><line x1="${sx(b[2])}" y1="${y}" x2="${sx(b[3])}" y2="${y}" stroke="${b[4]}" stroke-width="2"/><circle cx="${sx(b[1])}" cy="${y}" r="3" fill="${b[4]}"/>`;y+=30;});
  return `<svg viewBox="0 0 ${W} ${y}"><line x1="${zero}" y1="${top}" x2="${zero}" y2="${y-16}" stroke="${COL.ink}" stroke-dasharray="3 3"/><text x="${zero}" y="${top-3}" font-size="9" fill="${COL.ink}" text-anchor="middle">差なし</text><line x1="${marg}" y1="${top}" x2="${marg}" y2="${y-16}" stroke="${COL.red}" stroke-dasharray="3 3"/><text x="${marg}" y="${top-3}" font-size="9" fill="${COL.red}" text-anchor="middle">許容限界</text>${rows}</svg>`;
}
function fSpaghetti(){
  const W=320,H=150,pad=24,sc=scaler([0,4],[0,10],W,H,pad),t=[0,1,2,3,4];let lines="";
  for(let i=0;i<7;i++){const base=2+Math.random()*4,slope=0.5+Math.random()*1.3,pts=t.map(x=>[x,base+slope*x+(Math.random()-0.5)]);lines+=`<path d="${path(pts,sc)}" fill="none" stroke="${COL.teal}" stroke-width="1" opacity=".4"/>`;}
  lines+=`<path d="${path(t.map(x=>[x,3+1.1*x]),sc)}" fill="none" stroke="${COL.red}" stroke-width="2.6"/>`;
  return `<svg viewBox="0 0 ${W} ${H}">${lines}<text x="${sc.x(2)}" y="${H-6}" font-size="9" fill="${COL.soft}" text-anchor="middle">時間(受診回) →</text><text x="6" y="${pad}" font-size="9" fill="${COL.soft}">値</text><text x="${W-pad}" y="${sc.y(7.6)}" font-size="9" fill="${COL.red}" text-anchor="end">全体の平均</text></svg>`;

function fOverfit(){
  const W=320,H=150,pad=26,sc=scaler([0,10],[0,10],W,H,pad),tr=[],va=[];
  for(let c=0;c<=10;c+=0.5){const t=8*Math.exp(-c/2.2)+0.4;tr.push([c,t]);va.push([c,t+0.16*Math.pow(Math.max(0,c-3),1.8)]);}
  return `<svg viewBox="0 0 ${W} ${H}"><path d="${path(tr,sc)}" fill="none" stroke="${COL.teal}" stroke-width="2"/><path d="${path(va,sc)}" fill="none" stroke="${COL.red}" stroke-width="2"/><text x="${W-pad}" y="${sc.y(0.8)}" font-size="9" fill="${COL.teal}" text-anchor="end">学習データ(暗記)</text><text x="${W-pad}" y="${sc.y(6.5)}" font-size="9" fill="${COL.red}" text-anchor="end">新しいデータ</text><text x="${sc.x(5)}" y="${H-6}" font-size="9" fill="${COL.soft}" text-anchor="middle">モデルの複雑さ →</text><text x="6" y="${pad}" font-size="9" fill="${COL.soft}">誤差</text></svg>`;
}
function fDiD(){

function fPhack(){
  const W=320,H=150,pad=26,n=20,sc=scaler([0,1],[0,26],W,H,pad),bw=(W-2*pad)/n*0.82;
  let bars="";for(let i=0;i<n;i++){let h=(i===0)?24:Math.max(2,9-i*0.35);const x=sc.x(i/n)+((W-2*pad)/n-bw)/2,y=sc.y(h),col=(i===0)?COL.red:COL.teal;bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${H-pad-y}" fill="${col}" opacity=".78"/>`;}

function md(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\*\*([^*]+)\*\*/g,(m,w)=>(typeof GTERMS!=="undefined"&&GTERMS.has(w))?`<span class="kw lk" data-term="${w}">${w}</span>`:`<strong class="kw">${w}</strong>`).replace(/\n/g,"<br>");}
function block(b){
  if(b.p)return `<p>${md(b.p)}</p>`;
  if(b.box)return `<div class="box" style="border-left-color:${b.box.c||COL.teal}"><div class="bt" style="color:${b.box.c||COL.teal}">${md(b.box.t)}</div><div class="bb">${md(b.box.b)}</div></div>`;
  if(b.fig){let inner=b.fig.pyr?pyramid(b.fig.pyr):(b.fig.html?FIGS[b.fig.html]():"");
    return `<figure><div class="figbox">${inner}</div><figcaption><b>図${b.fig.n}.</b> ${md(b.fig.cap)}</figcaption></figure>`;}
  if(b.rows)return `<div class="rows">`+b.rows.map(r=>`<div><span class="k" style="color:${r[2]||COL.teal}">${r[0]}</span><span>${md(r[1])}</span></div>`).join("")+`</div>`;
  if(b.iact)return `<div class="iact" data-kind="${b.iact}"></div>`;
  if(b.gloss)return `<div id="glossWrap"></div>`;
  return "";
}

 {p:"検定の種類は多くて最初は圧倒されますが、選び方は機械的です。料理で「材料が決まればメニューが絞れる」のと同じ。次の4つを確認するだけ。①測っているのは「量」か「種類分け」か ②比べるグループはいくつか ③同じ人を前後で測っているか ④データが富士山型に近いか。"},
 {fig:{n:"5-1",cap:"検定選びの地図。まず「量か種類分けか」で二手に分かれ、次にグループ数で枝分かれします。富士山型からひどく外れていたら、下の「順位で比べる検定」に乗り換えます。",html:"fFlow"}},
 {box:{t:"具体例で考える",b:"・薬Aと薬Bで「血圧の下がり方」を別々の患者で比べる → t検定\n・同じ患者の「治療前と後」を比べる → 対応のあるt検定\n・3種類の食事療法で「体重の減り」を比べる → 分散分析\n・「治療した/しない」と「再発した/しない」の関係 → カイ二乗検定\n・「飲酒量」と「肝機能の値」の連動 → 相関"}},
 {p:"④の富士山型かどうかも大事。山型に近ければ平均を使う**ふつうの検定**(山型を前提にする方法)が使え、少ない人数でも差を見つけやすい長所があります。山型から大きく外れたり人数がごく少ないときは、値そのものでなく**順位**に置きかえて比べる方法(山型を仮定しない方法)が安全です。"},
 {box:{t:"たとえると",c:G,b:"順位で比べる方法は、テストの点数そのものでなく「クラスで何番か」で比べるようなもの。1人だけ極端な満点や0点がいても順位は大きく動かないので、外れ値に強いのです。データがいびつなときは、点数より順位、と覚えましょう。"}},
 {p:"迷ったら、まずデータをグラフに描いて形を見る。それから地図をたどる。この順番を守れば、検定選びで大きく外すことはありません。"}
]},
{t:"6. p値の誤解と「効果の大きさ」",b:[
 {p:"p値が答えてくれるのは「差があるかどうか」だけで、「その差がどれくらい大きいか」は教えてくれません。ここを混同すると論文の読み方を大きく誤ります。"},
 {box:{t:"よくあるつまずき",c:R,b:"人数をうんと増やすと、ほんのわずかな差でもp値は小さくなり「統計的に差あり」と出ます。1万人で「血圧が平均0.5だけ下がった」でも、その低下に臨床的な意味はほぼありません。逆に人数が少ないと、意味のある差も「差なし」と出ます。「統計的に差あり」と「臨床的に大事」はまったく別物です。"}},
 {p:"そこで「差の大きさそのもの」を表す指標を、p値と一緒に必ず見ます。とくに治療効果では、次の分かりやすい言い換えが役立ちます。"},
 {fig:{n:"6-1",cap:"効果の大きさを表す指標。倍率で言うか(相対)、実数の差で言うか(絶対)で、受ける印象がまるで変わります。患者さんへの説明にはとくに絶対の指標が誠実です。",rows:true}},
 {rows:[["相対リスク(倍率)","治療した人の発症率が、しない人の何倍か。0.5なら半分に減る"],["絶対的な差","発症率そのものの引き算。2%が1%になったなら「1%の差」"],["治療必要数","1人の発症を防ぐのに何人を治療すればよいか。少ないほど効率的"]]},
 {box:{t:"「半分に減る」の正体",c:GD,b:"「リスクが50%減!」は劇的に聞こえます。でも、もともと2%が1%になっただけなら、救われるのは100人に1人(1人防ぐのに100人の治療が必要)。一方、40%が20%になる「50%減」なら5人に1人が救われ、はるかに価値が高い。同じ50%減でも中身は大違いです。倍率(相対)は誇張されがちなので、必ず実数の差(絶対)もセットで確認を。"}},
 {p:"論文を読むときは「p＜0.05か?」で満足せず、「で、効果はどれくらい大きいの?」「100人治療したら何人救われるの?」と必ず問い直す。この一手間が、数字に振り回されないための最大のコツです。"}
]},
{t:"7. 相関と回帰（関係≠原因）",b:[
 {p:"「お酒をよく飲む人ほど肝臓の数値が高い」のように、2つの量が一緒に動く度合いを表すのが**相関**です。強さは −1〜+1 で表し、+1に近いほど「片方が増えると、もう片方もきれいに増える」、−1に近いほど「片方が増えると減る」、0に近いほど「関係がはっきりしない」を意味します。"},
 {fig:{n:"7-1",cap:"点が右肩上がりの一直線に近いほど「強い正の関係」。バラけているほど関係は弱く、右肩下がりなら負の関係です。点を目で見ることがとても大切です。",html:"fCorr"}},
 {box:{t:"いちばん大事な注意 — 関係があっても原因とは限らない",c:R,b:"「アイスがよく売れる日は水の事故も多い」——事実ですが、アイスが事故を起こすわけではありません。どちらも「夏の暑さ」という第三の原因のせいで一緒に増えているだけ(隠れた共通の原因)。医学でも「コーヒーをよく飲む人は◯◯病が多い」とき、本当の原因は喫煙かもしれません。「一緒に動く(相関)」と「原因である(因果)」はまったく別物だと肝に銘じてください。"}},
 {p:"相関が「2つの量の連動」を見るのに対し、複数の要因から結果を予測・説明する仕組みが**回帰**です。いくつもの要因を同時に式に入れると、たとえば「年齢の影響を差し引いたうえで、本当にこの薬に効果があるか」を調べられます。先ほどの隠れた共通の原因を計算で打ち消す、強力な道具です。"},
 {box:{t:"どんなとき何を使うか",b:"結果が「量」(血圧など) → ふつうの回帰(要因が1増えると結果がいくつ変わるか)\n結果が「あり/なし」 → ロジスティック回帰(オッズという倍率が出る)\n結果が「起きるまでの時間」 → 生存解析の回帰(次章)"}},
 {p:"ただし要因を欲ばって入れすぎると、その研究だけにしか当てはまらない「こじつけの式」ができます(**過剰適合**＝合わせすぎて応用が利かない状態)。目安は「起きた出来事の件数の1割程度まで」。発症が20件なら要因は2つまで、というイメージです。多ければよいわけではありません。"}
]},
{t:"8. 生存解析と研究デザイン",b:[
 {p:"がんの再発や生存のように「いつ起きるか(起きるまでの時間)」を調べたい場面があります。ふつうの平均で扱いにくいのは、研究終了まで「まだ起きていない人」や、途中で通院しなくなり「その後不明の人」がいるから。この「最後まで見届けられなかった」状態を**打ち切り**と呼びます。"},
 {box:{t:"たとえると",c:G,b:"マラソンで全員のゴールタイムを知りたいが、5時間で観測を打ち切ると、まだ走っている人は「少なくとも5時間はかかっている(正確なタイムは不明)」としか言えません。この「少なくともここまでは大丈夫だった」情報を捨てずに活かすのが、生存解析の賢いところです。"}},
 {p:"その結果を描いたのが下の階段状のグラフ(**生存曲線**＝時間とともに「まだ起きていない人」の割合がどう減るかを示す線)です。誰かに出来事(再発など)が起きるたびに線がカクッと下がります。横ばいは「脱落した人がいただけで出来事は起きていない」を表します。2本が離れていれば、2グループで経過に差があります。"},
 {fig:{n:"8-1",cap:"上にある線(治療群)ほど「まだ起きていない人」が多く、経過が良いことを示します。線の差を確かめる方法や「危険度が何倍か」を出す方法もありますが、まずは「階段が下がる」イメージを押さえれば十分です。",html:"fKM"}},
 {p:"ここから「その研究はどれくらい信用できるか?」というデザインの話へ。同じ「効果あり」でも、組み立て方しだいで信頼度はまるで違います。下は、上にいくほど信頼度が高い研究の種類です。"},
 {fig:{n:"8-2",cap:"信頼度のピラミッド。上ほど「原因と結果」を強く言えます。ただし種類が上だから無条件に正しいのではなく、一つひとつの研究がていねいに行われているかが何より大切です。",pyr:[["たくさんの研究を統合(最上位)",1],["くじ引きで群分けする試験",0.82],["集団を長期間追いかける研究",0.64],["病気の人と健康な人を比べる研究",0.5],["ある時点で一斉に調べる研究",0.36],["症例報告・専門家の意見",0.24]]}},
 {box:{t:"なぜ「くじ引き」が強いのか",c:GD,b:"新薬の試験で患者さんをくじ引き(ランダム)で薬グループとそうでないグループに分けるのには理由があります。くじ引きなら、年齢・重症度・生活習慣など、私たちが気づいていない違いまで2グループにほぼ均等にばらまかれます。だから後で差が出れば「薬のおかげ」と強く言える。これがくじ引き試験(ランダム化比較試験)が上位にある最大の理由です。"}}
]},
{t:"9. 必要な人数と「差を見つける力」",b:[
 {p:"研究を始める前に必ず考えること——「何人集めれば、知りたい差をちゃんと見つけられるか?」です。少なすぎれば本当は効く薬でも「差なし」と見逃し、参加者の負担が無駄に。多すぎれば不要な人にまで負担をかけ、費用も時間も浪費します。ちょうどよい人数を前もって見積もるのが**必要人数の計算**です。"},
 {p:"必要な人数は主に4つで決まります。①どれくらいの「早とちり」を許すか ②どれくらい確実に差を見つけたいか(=**検出力**、差があるときそれを見つけられる力。ふつう8割以上が目標) ③見つけたい差の大きさ ④データのばらつき。「小さな差を」「ばらつきの大きいデータで」「確実に見つけたい」ほど、たくさんの人数が要ります。"},
 {fig:{n:"9-1",cap:"人数(横軸)を増やすほど、差を見つける力(縦軸)は上がります。ただしある程度から伸びは鈍り頭打ちに。多くの研究は「8割の力」(赤線)を目標に、それを満たす最小限の人数を選びます。",html:"fPower"}},
 {box:{t:"たとえると",c:G,b:"暗い部屋で文字を読むのに似ています。文字が大きければ(差が大きければ)少しの明かりでも読めますが、小さい文字(小さな差)を確実に読むにはたっぷりの明かり(多くの人数)が必要。始める前に「どれくらいの明るさが要るか」を計算しておくわけです。"}},
 {box:{t:"いちばん大事 — 「差がなかった」の落とし穴",c:R,b:"人数が足りない研究は、本当は効く薬でも「差は出ませんでした」を量産します。だから論文で「有意差なし」とあっても、それは「効かない」証明ではありません。「差を見つけるには人数が足りなかっただけ」かもしれない。「差がなかった」と「差を見つけられなかった」はまったく違う——陰性結果を読むときは、その研究に十分な人数があったか必ず確かめましょう。"}},
 {p:"実際の計算は専用ソフトがやってくれますが、大切なのは考え方です。「結果が出てから人数を考える」のではなく「始める前に必要人数を見積もる」。この順番が、信頼できる研究の出発点です。"}
]},
{t:"10. 検査の評価（感度・特異度）",b:[
 {p:"この章は臨床に直結します。「ある検査が陽性。さて本当に病気なのか?」に数字で答える考え方です。出発点はたった4マスの表。実際に病気がある/ない × 検査が陽性/陰性、の組み合わせで人を分けます。"},
 {p:"ここから2つの力が出てきます。一つは**感度**(病気の人をちゃんと陽性と拾い上げる力＝見逃さない力)。もう一つは**特異度**(病気でない人をきちんと陰性と判定する力＝無関係な人を巻き込まない力)です。"},
 {box:{t:"覚え方のコツ",c:G,b:"感度の高い検査が「陰性」なら、病気はほぼ無いと安心(見逃さない力が高いので、すり抜けて陰性なら本当にいない)。逆に特異度の高い検査が「陽性」なら、病気はほぼ確実(無関係な人を巻き込まないので、陽性なら本物)。「感度高→陰性で除外」「特異度高→陽性で確定」とセットで覚えると実践で迷いません。"}},
 {p:"検査には「どこからを陽性とするか」の境目があり、それを動かすと感度と特異度はシーソーのように一方が上がれば他方が下がります。このバランス全体を一枚で見るのが下の曲線。左上にふくらむほど、感度も特異度も両立できる優秀な検査です。"},
 {fig:{n:"10-1",cap:"境目を変えたときの検査の成績を一筆書きにしたもの。左上の角に近づくほど「見逃さず、巻き込まず」の理想に近い。点線(斜め)は「コイン投げと同じ＝役に立たない」検査を表します。",html:"fROC"}},
 {box:{t:"いちばんの落とし穴 — 同じ検査でも集団で意味が変わる",c:R,b:"「精度99%の検査が陽性なら99%病気」——これは間違い。1万人に1人の珍しい病気を症状のない大勢に検査すると、陽性の大半は「本当は病気でない人(偽陽性)」になります。もともと病気の人がごくわずかしかいないからです。もともと病気が多い集団(症状のある人)に使うのと、少ない集団(無症状の健診)に使うのとでは、陽性の重みがまるで違う。検査結果は「その人がもともとどれくらい病気らしいか」とセットで解釈する——これが次章につながります。"}},
 {p:"つまり「良い検査」も、使う相手を間違えると役に立たないどころか害になります。数字そのものだけでなく「誰に使うのか」を常に意識する——臨床で最も実践的な教訓です。"}
]},
{t:"11. たくさん比べると「偶然の当たり」が出る",b:[
 {p:"くじを思い浮かべてください。一回でアタリ(偶然の差)が出る確率は低くても、何十回も引けばどこかで一回くらいアタリが出ます。検定も同じで、たくさん繰り返すほど「本当は差がないのに偶然「差あり」と出る」当たりくじを、いつか引いてしまう。これが**多重比較**の問題です。"},
 {fig:{n:"11-1",cap:"検定の回数(横軸)が増えるほど、「どこかで偶然の差が出てしまう」確率(縦軸)はぐんぐん上がります。20回比べれば、すべて差がなくても6割以上の確率で「偶然のアタリ」を引く計算です。",html:"fMulti"}},
 {box:{t:"具体例で考える",c:R,b:"ある食品が「がんを減らすか」を、胃がん・大腸がん・肺がん…と20種類で別々に検定したとします。本当はどれにも効果がなくても、20回調べれば偶然どれか1つで「効果あり!」が出ます。そこだけ取り上げて「この食品はがんに効く」と宣伝するのは、ハズレ19回を隠してアタリ1回だけ見せるようなもの。あやしい健康情報にはこの手のものが多く紛れています。"}},
 {p:"これを防ぐには、たくさん検定するならその分だけ判定の基準を厳しくします(回数が多いほど、当たりと認める線を引き上げる)。やり方にはいくつか流儀がありますが、難しい名前は今は覚えなくて構いません。「たくさん比べたら、その分きびしくする」という発想だけ持ち帰ってください。"},
 {box:{t:"後出しの注意",b:"全体では効果がなかったとき、「でも高齢者だけ見ると効いていた」「男性だけなら有効」と後から部分集団を探すのは、まさに当たりくじ探し。こうした後出しの発見は偶然の可能性が高く、そのまま信じるのは危険です。あらかじめ「この集団で調べる」と決めてあった分析かどうかが、信頼できるかの分かれ目です。"}},
 {p:"だからこそ良い研究は、最初に「いちばん知りたいこと」を1つに絞って宣言します。あれもこれもと欲ばらず本命を一つ決めておく——これが偶然のアタリに惑わされないための研究設計の知恵です。"}
]},
{t:"12. ベイズの考え方（医師の思考そのもの）",b:[
 {p:"これまでの考え方(従来の主流のやり方)は「もし差がなかったら、この結果はどれくらい珍しいか」を問うものでした。一方**ベイズの考え方**は、もっと直感に近い問い方をします。「最初の見込みを、新しい情報でどう更新するか」。じつはこれは、医師が毎日やっている思考そのものです。"},
 {box:{t:"医師は毎日ベイズをしている",c:G,b:"外来で患者さんを診るとき、問診の段階で「この症状ならたぶん風邪だろう(最初の見込み)」とあたりを付けます。そこに検査結果が加わると、「やっぱり風邪だ」または「いや別の病気かも」と見込みを更新します。最初の印象を新しい証拠で書き換えていく。この自然な流れを、きちんと数字でやるのがベイズです。"}},
 {p:"ポイントは、検査結果は確率を「ゼロか100か」にするのではなく、もともとの見込みを更新するだけ、という点。同じ陽性結果でも、出発点(その人がもともとどれくらい病気らしいか)が違えば、たどり着く結論はまったく変わります。"},
 {fig:{n:"12-1",cap:"珍しい病気(もともと1割の見込み)の人が陽性結果を得たときの更新。検査前1割が、検査後には6割強まで跳ね上がる——でも100%にはなりません。検査は「見込みの更新」であって断定ではないのです。",html:"fBayes"}},
 {box:{t:"いちばん大事 — 出発点で結論が変わる",c:GD,b:"まったく同じ「陽性」でも、「健診でたまたま見つかった症状ゼロの人」と「いかにもその病気らしい症状がある人」とでは意味が大違い。前者はもともとの見込みが低いので、陽性でもまだそこまで濃厚ではないかもしれない。後者はもともと濃厚なので陽性ならほぼ確定に近い。だから検査を見るときは、いつも「この人はそもそもどれくらい病気らしかったか?」を先に考える——これがベイズ的なものの見方です。"}},
 {p:"従来のやり方とベイズは対立ではなく、得意分野が違う道具です。「データから珍しさを測る」のが従来流、「最初の見込みを情報で更新する」のがベイズ流。最近はベイズを取り入れた臨床試験も増えています。難しい計算は専門家に任せてよいので、「検査は断定でなく見込みの更新」という発想を、ぜひ日々の診療に持ち込んでみてください。"}
]}
,
{t:"13. 交絡 ―「見かけの関係」をどう取り除くか",b:[
 {p:"第7章で「関係があっても原因とは限らない」と学びました。その犯人の多くが**交絡因子**です。これは、原因とされるものと結果の「両方」に影響する、横から口を出す第三者のこと。これがいると、本当は無関係でも関係があるように見えたり、逆に本物の効果が隠れたりします。"},
 {fig:{n:"13-1",cap:"年齢のような交絡因子は、「原因とされるもの」と「結果」の両方に矢印を伸ばします。そのせいで、下の点線(本当は無いかもしれない関係)があるように見えてしまうのです。",html:"fConfound"}},
 {box:{t:"具体例",c:R,b:"「コーヒーをよく飲む人は心臓病が多い」というデータが出たとします。でも実は、コーヒー好きには喫煙者が多かっただけかもしれません。ここでの黒幕は**喫煙**。喫煙はコーヒー量とも心臓病とも結びつくので、コーヒー自体は無実なのに「コーヒー→心臓病」という見かけの関係を作り出します。"}},
 {p:"では、この黒幕をどう追い払うか。くじ引き(ランダム化)ができる試験なら自動的に均せます(第8章)。しかし、すでに集まったデータ(観察研究)では、計算で打ち消すしかありません。代表的な手立てが3つあります。"},
 {box:{t:"交絡を取り除く3つの手立て",b:"・**層別化**：年齢層ごと・喫煙の有無ごとに分けて、それぞれの中で比べる(黒幕を固定してしまう)\n・**多変量調整**：黒幕も一緒に式に入れて、その影響を差し引く(第14章の回帰)\n・**傾向スコア**：「この人がどれくらい治療を受けそうか」を一つの点数にまとめ、似た者同士で比べる"}},
 {box:{t:"ここに注意",c:GD,b:"調整できるのは「測れた黒幕」だけです。測り忘れた要因や、そもそも気づいていない要因は打ち消せません。だから観察研究は、どれだけ丁寧に調整しても「原因と断定」まではいきにくい。くじ引き試験が今も別格に強いのは、測れない黒幕まで均してくれるからです。"}},
 {p:"論文を読むときは「どんな交絡因子を、どうやって調整したか」を必ず確認しましょう。調整前と調整後で結果が大きく変わっていたら、その関係はかなり交絡に左右されていた、というサインです。"}
]}
,
{t:"14. ロジスティック回帰 ―「あり/なし」を読み解く",b:[
 {p:"第7章で、結果が「発症あり/なし」のような2択のときは**ロジスティック回帰**を使うと触れました。ここをもう少し掘り下げます。ふつうの回帰は「血圧がいくつ変わるか」を直線で予測しますが、確率は0〜1の間しかとれないので、直線だと1を超えたり0を下回ったりして不都合です。"},
 {fig:{n:"14-1",cap:"そこで、なめらかなS字カーブを当てはめます。要因が弱いうちは発症確率がほぼ0、強くなるとぐっと立ち上がり、やがて1に近づく。0と1の間にきれいに収まるのがミソです。",html:"fLogistic"}},
 {p:"この方法から出てくるのが**オッズ比**という倍率です。「オッズ」は耳慣れませんが、競馬のオッズと同じで「起こりやすさ÷起こりにくさ」のこと。オッズ比は、要因が1段階増えたときにそのオッズが何倍になるかを表します。"},
 {box:{t:"読み方のコツ",c:G,b:"オッズ比が2なら「その要因があると、発症のオッズが約2倍」。1なら影響なし、1より小さければ予防的。そして第3章で学んだ信頼区間が「1」をまたいでいなければ、統計的に意味のある関連と読めます。たとえば「オッズ比2.1(95%信頼区間 1.3〜3.4)」なら、1をまたいでいないので関連あり、と判断します。"}},
 {box:{t:"よくあるつまずき",c:R,b:"オッズ比は、病気がまれなときはリスクの倍率(相対リスク)に近い値ですが、病気がありふれているとオッズ比はリスクの倍率より大げさに出ます。「オッズ比3倍」を「リスクが3倍」と早合点しないこと。とくにありふれた病気では要注意です。"}},
 {p:"さらに進むと、「ある要因の効果が、別の要因によって変わる」という**交互作用**も扱えます。たとえば「この薬は若い人には効くが高齢者には効かない」といった具合。式の中で要因どうしを掛け合わせて調べます。多くの要因を同時に入れて交絡も調整できる(第13章)——これがロジスティック回帰が観察研究の主役である理由です。"}
]}
,
{t:"15. Cox回帰とハザード比 ― 時間を味方につける",b:[
 {p:"第8章の生存曲線を覚えていますか。あれは2グループを「見た目」で比べる方法でした。では「年齢や重症度の違いを差し引いたうえで、治療そのものの効果はどれくらいか」を知りたいときは? そこで登場するのが**Cox回帰**です。生存解析版の多変量回帰、と思ってください。"},
 {p:"ここから出てくるのが**ハザード比**という倍率です。ハザードとは「ちょうど今この瞬間に、その出来事が起きる勢い」のこと。ハザード比は、その勢いがグループ間で何倍違うかを表します。"},
 {box:{t:"読み方のコツ",c:G,b:"ハザード比が0.7なら「治療群では、出来事が起きる勢いが対照の0.7倍(=3割ほど抑えられている)」。1なら差なし、1より大きいと悪化。これも信頼区間が「1」をまたぐかどうかで意味を判断します。論文では「ハザード比0.68(95%信頼区間 0.55〜0.84)」のように書かれます。"}},
 {fig:{n:"15-1",cap:"Cox回帰がうまく働くには、2グループの「勢いの差」が観察期間を通じてだいたい一定であることが前提です(下の2本の線のように、開いた差が途中で逆転したりしない)。",html:"fKM"}},
 {box:{t:"いちばん大事な前提 ― 比例ハザード",c:GD,b:"ハザード比という「1つの倍率」で語れるのは、「勢いの差が時間によらず一定」という前提があるからです(これを比例ハザードと呼びます)。もし途中で2本の生存曲線が交差するような状況だと、この前提は崩れ、「全期間で◯倍」という単一の数字では語れません。論文ではこの前提が確認されているかが、地味ですが重要なチェックポイントです。"}},
 {box:{t:"打ち切りの落とし穴",c:R,b:"第8章の「打ち切り」は便利な仕組みですが、脱落の理由が結果と関係していると話が狂います。たとえば「具合が悪化した人ほど通院をやめてしまう」場合、その人たちを単なる打ち切りとして扱うと、治療を実際より良く見せてしまいます。脱落が「たまたま」なのか「理由あり」なのかは要注意です。"}}
]}
,
{t:"16. メタ解析 ― たくさんの研究を束ねる",b:[
 {p:"一つの研究だけでは、人数が少なかったり、たまたまの結果だったりします。そこで、同じ問いを扱った複数の研究をかき集めて統合するのが**メタ解析**です。第8章のピラミッドの頂点に位置する、最も信頼度の高い方法とされます。"},
 {p:"その結果を一枚にまとめた図が**フォレストプロット**(森のように線が並ぶ図)です。各研究の結果を、点(効果の中心)と横線(信頼区間)で表し、最後に全部を束ねた結論をひし形で示します。"},
 {fig:{n:"16-1",cap:"各研究の四角が効果の中心、横線が信頼区間。縦の点線(1.0)をまたぐ研究は単独では「差あり」と言い切れません。しかし下の赤いひし形(統合結果)は線が細く1.0をまたがない――束ねることで結論がはっきりしました。",html:"fForest"}},
 {box:{t:"統合の威力",c:G,b:"上の図では、研究AやCは単独だと信頼区間が1.0をまたいで「はっきりしない」のに、全部束ねると幅の狭いひし形になり「効果あり」と読めます。小さな研究をたくさん集めて、まるで一つの大規模研究のように扱える――これがメタ解析の強みです。"}},
 {box:{t:"気をつける2点",c:R,b:"・**ばらつき(異質性)**：集めた研究の結果がてんでバラバラだと、無理に束ねても意味が薄い。「研究間の食い違いがどれくらいか」を表す指標(I²など)を確認します。\n・**出版バイアス**：「効果あり」の研究は論文になりやすく、「効果なし」はお蔵入りしがち。すると都合のよい研究ばかり集まり、効果を過大評価します。これを点検する図(ファネルプロット)が左右対称かどうかも見どころです。"}},
 {p:"つまりメタ解析は万能ではなく、「何を集めたか」「集め方に偏りはないか」で質が決まります。きれいなフォレストプロットを見たら、その裏で異質性と出版バイアスがどう検討されているかまで確認するのが、一歩進んだ読み方です。"}
]}
,
{t:"17. 欠測データとITT ― 抜けた人をどう扱うか",b:[
 {p:"現実の研究では、必ず誰かが抜けます。通院をやめた、引っ越した、副作用で中断した――こうした**欠測**(データが抜けること)や脱落の扱いは、結果を大きく左右する、地味だけれど決定的な論点です。"},
 {box:{t:"なぜ「抜けた人」が問題か",c:R,b:"脱落には理由があることが多いからです。「効かないからやめた」「副作用がつらくてやめた」人を解析から外すと、最後まで続けられた「都合のよい人」だけが残り、治療を実際より良く見せてしまいます。抜けはランダムに起きるとは限らない――ここが落とし穴です。"}},
 {p:"この問題への王道の答えが**ITT解析**(割り付けられた通りに全員を解析する、という原則)です。途中でやめた人も、最初に割り当てられたグループの一員として最後まで数える。一見おかしいようですが、これが現実の効果を正直に映します。"},
 {fig:{n:"17-1",cap:"上は割付通り全員を解析する考え方。下は完遂者だけを解析する考え方。脱落者を外すと「都合のよい人」だけが残り、効果が過大に見えがちです。だから慎重な試験ほど全員解析を主役に据えます。",html:"fITT"}},
 {box:{t:"たとえると",c:G,b:"ダイエット器具の効果を調べるのに、「最後まで続けられた人だけ」で平均すると、もともと根性のある人ばかりが残って効果が立派に見えます。でも実生活では多くの人が三日坊主。「買った人全員」で評価するほうが、世の中での本当の効果に近いのです。"}},
 {p:"抜けた部分を埋める工夫(欠測値を統計的に推測して補う方法など)もありますが、いちばん大切なのは「そもそも脱落を減らす設計」と「脱落者がどんな人だったかを正直に報告すること」。論文では脱落率と、その人たちの扱いが明記されているかを必ず確認しましょう。"}
]}
,
{t:"18. 遺伝統計入門 ― 究極の「たくさん比べる」世界",b:[
 {p:"最後は、研究の最前線に近い話です。病気に関わる遺伝子を探すとき、ヒトのゲノム全体にある数十万〜数百万か所を、一気に病気との関連で調べます(ゲノムワイド関連解析、略してGWAS)。ここで第11章の「たくさん比べると偶然の当たりが出る」問題が、極限まで膨れ上がります。"},
 {p:"100万か所を別々に検定すれば、すべて無関係でも、ふつうの基準(5%)では5万か所も「偶然のアタリ」が出てしまいます。これでは本物が埋もれます。そこで基準を桁違いに厳しくします。"},
 {fig:{n:"18-1",cap:"横軸はゲノム上の位置、縦軸は関連の強さを表すマンハッタンプロット。大半は低い雑音ですが、ところどころ高くそびえる「山」があります。赤い線(ゲノム全体用の超厳しい基準)を超えた山だけが、本物の候補です。",html:"fManhattan"}},
 {box:{t:"どれくらい厳しいのか",c:GD,b:"GWASでよく使う基準は「p＜0.00000005」(5×10⁻⁸)という途方もない厳しさです。第11章で学んだ「たくさん比べたら、その分きびしくする」という発想を、100万回ぶんに適用した結果がこれ。ふつうの研究の0.05とは桁が10個近く違います。"}},
 {box:{t:"偽陽性率という別の物差し",c:G,b:"何十万も調べる世界では、「1つも間違えない」を目指すと厳しすぎて何も見つかりません。そこで発想を変え、「見つけた当たりのうち、間違いが何割までなら許すか」を管理する方法(偽発見率の制御)もよく使われます。遺伝子解析やオミクスの大量データでは、こちらの考え方が主役になります。"}},
 {p:"こうして見つかった候補は、それだけでは「関連がある」止まり。本当に病気の原因かは、別の集団で再現できるか(第16章のメタ解析的な検証)、生物学的に説明がつくかを積み重ねて確かめます。膨大な「たくさん比べる」を制御しつつ、本物を選り分ける――統計の知恵が研究の生命線になる領域です。"}
]}
,
{t:"19. 臨床試験の発展デザイン",b:[
 {p:"くじ引き試験(第8章)にも、目的に応じた発展形があります。代表が**非劣性試験**。新薬が既存薬より「優れている」ことを示すのが難しくても、「実用上、明らかに劣ってはいない」と示せれば十分なことがあります。たとえば効果は同程度でも、副作用が軽い・安い・飲みやすい薬なら、それだけで価値があります。"},
 {fig:{n:"19-1",cap:"横軸は新薬と既存薬の差。0が「差なし」、赤い線が「ここまでの劣りなら許容できる」という事前に決めた限界。信頼区間がこの限界をはみ出さなければ「非劣性」と判定します。",html:"fNonInf"}},
 {box:{t:"非劣性試験の落とし穴",c:R,b:"「許容限界」をゆるく設定すると、本当はかなり劣る薬でも「非劣性」と言えてしまいます。限界をどこに引いたか、その根拠は妥当かが命。また「優越性は示せなかった→だから同等」と言い換えるのも誤りです。最初から非劣性を目的に設計したのか、後付けかを見抜く必要があります。"}},
 {box:{t:"その他の発展形",c:G,b:"・**クロスオーバー試験**：同じ患者に両方の治療を順番に試し、自分自身を対照にする(個人差を消せて効率的だが、治る病気や進行する病気には不向き。前の治療の影響を抜く休薬期間も必要)\n・**中間解析**：試験の途中で結果をのぞき見し、明らかに有効/有害/見込みなしなら早めに中止する。ただし何度ものぞき見は偽陽性を増やす(第11章)ので、止める基準を事前に厳密に決めておく必要があります。"}},
 {p:"デザインは「何を証明したいか」から逆算して選びます。論文を読むときは、まず「この試験は優越性を狙ったのか、非劣性なのか」を確認するだけで、結果の意味の重さが変わってきます。"}
]}
,
{t:"20. 縦断データと混合効果モデル",b:[
 {p:"同じ患者さんを何度も繰り返し測ること(通院ごとの検査値など)はよくあります。これを**縦断データ**と呼びます。ここで素朴な方法を使うと、思わぬ落とし穴にはまります。"},
 {box:{t:"なぜ問題か",c:R,b:"1人の患者を10回測ったデータを、「10人ぶんの独立したデータ」として扱うと、実際よりずっと多くの情報があるように錯覚します。すると本当は不確かなのに「差あり」と出やすくなる。同じ人の繰り返しは互いに似ている(独立でない)ので、ふつうの方法の前提が崩れるのです。"}},
 {p:"これを正しく扱うのが**混合効果モデル**です。「全体に共通する傾向」と「一人ひとり固有のクセ(高めの人・低めの人、効きやすい人・にくい人)」を、同じ式の中で別々に見積もります。途中の受診が抜けても、ある分のデータを活かせる柔軟さも長所です。"},
 {fig:{n:"20-1",cap:"細い線が一人ひとりの推移(出発点も傾きもバラバラ)、太い赤線が全体の平均的な傾向。個人差を無視して平均線だけ見ると、大事な「人によって違う」情報を捨ててしまいます。",html:"fSpaghetti"}},
 {box:{t:"クラスターも同じ話",c:G,b:"「同じ病院の患者は似た傾向を持つ」「同じ家族・地域はまとまる」といった集団(クラスター)構造でも同じ問題が起きます。これを無視すると精度を過信します。患者が病院にぶら下がる入れ子の構造も、混合効果モデルでうまく扱えます。"}},
 {p:"繰り返し測定や入れ子のデータを見たら、「独立として扱っていないか?」と一度立ち止まる。これが縦断データを読み解く第一歩です。"}
]}
,
{t:"21. 予測モデルと機械学習の基礎",b:[
 {p:"ここまでは主に「何が効くか・関係するか」を**説明**する統計でした。最近は「この患者は再発しそうか」を**予測**する方向も盛んです。考え方の土台は同じですが、評価のしかたが変わります。"},
 {p:"最大の敵が**過学習**(オーバーフィッティング)です。手元のデータに合わせ込みすぎたモデルは、そのデータは完璧に言い当てるのに、新しい患者ではまるで当たらない——丸暗記した生徒が応用問題で崩れるのと同じです。"},
 {fig:{n:"21-1",cap:"モデルを複雑にするほど、学習に使ったデータの誤差(青)は下がり続けます。しかし新しいデータの誤差(赤)は途中から逆に増える。この赤が最小になるあたりが、ちょうどよい複雑さです。",html:"fOverfit"}},
 {box:{t:"いちばん大事 — 交差検証",c:G,b:"モデルの本当の実力は、「学習に使っていない別のデータ」で試して初めて分かります。データを学習用と検証用に分けて試す**交差検証**は、過学習にだまされないための必須の作法。学習に使ったデータでの成績(=暗記の出来)を実力と勘違いしないこと。"}},
 {box:{t:"2つの良し悪し",c:GD,b:"・**見分ける力(AUC)**：高リスクと低リスクをどれだけ順序よく区別できるか。第10章のROC曲線の下の面積そのものです。\n・**確率の正確さ(キャリブレーション)**：「20%の人」と予測した集団で、実際に約20%が発症するか。見分ける力が高くても、確率がズレていれば臨床では危険です。"}},
 {p:"予測モデルの論文では、「別の集団でも通用するか(外部検証)」まで確かめられているかが質の分かれ目。手元データの好成績だけで飛びつかないのが、賢い読み方です。膨大なゲノムや画像データの時代に、ますます重要になる視点です。"}
]}
,
{t:"22. 因果推論の発展 ― 観察データから原因に迫る",b:[
 {p:"第13章で交絡を学びました。くじ引きができない観察データから、それでも「原因」に少しでも近づくための、進んだ道具を紹介します。発想はどれも「擬似的にくじ引きの状況を作り出す」ことです。"},
 {box:{t:"傾向スコア(再訪)",c:G,b:"「この人がどれくらい治療を受けそうか」を背景情報から1つの点数にまとめ、同じくらいの点数の人同士(治療した人・しなかった人)を突き合わせて比べます。多くの交絡因子を一度に揃えられるので、観察研究で広く使われます。"}},

{t:"23. 研究の再現性とp-hacking",b:[

 {p:"その代表が**p-hacking**。一つの研究の中で、解析方法・対象の絞り込み・評価項目・調整する要因…と何通りも試し、たまたまp＜0.05になった組み合わせだけを報告する——第11章の「たくさん比べると当たりが出る」を、無意識にやってしまうのです。"},

]}

{t:"付録A. 消化器・IBDの統計事例",b:[

 {box:{t:"IBD研究のアウトカムと手法",c:TL,b:"・**臨床的寛解**(あり/なし) → 割合の比較。**相対リスク**や**オッズ比**、群間はカイ二乗検定\n・内視鏡スコア(Mayo内視鏡サブスコア0〜3など、順序) → 順位で比べる検定や、順序に対応した回帰\n・**再燃までの時間** → **生存曲線**(KM)とlog-rank、調整は**ハザード比**(Cox)\n・便回数・CRP・カルプロテクチン(連続) → t検定や、通院ごとの反復測定なら**混合効果モデル**"}},
 {p:"近年のUC/CD試験では、「臨床的寛解かつ内視鏡的改善」のように複数条件を束ねた**複合エンドポイント**がよく使われます。条件を厳しくするほど臨床的に意味は増しますが、達成者が減って検出力が下がる・解釈が複雑になる、というトレードオフがあります。"},
 {p:"生物学的製剤どうしの比較は、直接対決した試験(ヘッドツーヘッド)が少ないのが実情です。そこで複数の試験を間接的につなぐ**ネットワークメタ解析**で順位づけされることがありますが、これは間接比較ゆえの前提に依存するため、直接比較より慎重に読む必要があります(第16章)。"},
 {box:{t:"レジストリ・実臨床データの注意",c:R,b:"診療データやレジストリの観察研究は、重症な人ほど強い治療を受けるといった**交絡**が大きく出ます(第13章)。傾向スコアや多変量Coxで調整しますが、測れていない重症度などは消せません。「実臨床で効いた」も、交絡をどう扱ったかで重みが変わります。"}},
 {p:"先生の研究テーマに引きつければ、IBDの再燃予測モデル(第21章)や、疾患感受性遺伝子の探索(第18章・付録B)は、いずれもこれまでの章の延長線上にあります。アウトカムの型→手法→交絡と多重性への配慮、という流れは共通です。"}
]}

function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);const y=1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y;}
const ncdf=z=>0.5*(1+erf(z/Math.SQRT2));
const INTERACT={1:'spread',3:'tailprob',5:'nnt'};
function curveSVG(sd){
  const W=320,H=140,pad=18,xmin=-6,xmax=6,N=120,step=(xmax-xmin)/N,pts=[];let ymax=npdf(0,0,sd)*1.12;
  for(let i=0;i<=N;i++){const x=xmin+i*step;pts.push([x,npdf(x,0,sd)]);}
  const sx=v=>pad+(v-xmin)/(xmax-xmin)*(W-2*pad),sy=v=>H-pad-(v/ymax)*(H-2*pad);
  const d=pts.map((p,i)=>(i?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1)).join(' ');
  const shadeSeg=(lo,hi,col)=>{const seg=pts.filter(p=>p[0]>=lo&&p[0]<=hi);if(seg.length<2)return'';let s='M'+sx(seg[0][0]).toFixed(1)+' '+sy(0);seg.forEach(p=>s+=' L'+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1));s+=' L'+sx(seg[seg.length-1][0]).toFixed(1)+' '+sy(0)+' Z';return `<path d="${s}" fill="${col}" opacity=".2"/>`;};
  return {W,H,pad,sx,sy,d,shadeSeg};
}
function initInteractives(){
  document.querySelectorAll('.iact').forEach(el=>{

    if(k==='tailprob'){

        el.querySelector('.iz').textContent=z.toFixed(2);
        el.querySelector('.ip').textContent='両側 p ≈ '+(2*(1-ncdf(z))).toFixed(4);};
      el.innerHTML=`<div class="iact-t">▶ 動かせる図：基準値と両側p値</div><div class="iv"></div><div class="ir">基準値 z = <b class="iz"></b><input type="range" min="0.4" max="3.6" step="0.02" value="${z}"></div><div class="ip"></div><div class="ihint">スライダーで基準値を動かすと、両端の色つき面積＝p値が変わります。基準値が大きいほどpは小さく（偶然では起きにくく）なります。z=1.96でおよそ0.05です。</div>`;
      el.querySelector('input').oninput=e=>{z=+e.target.value;draw();};draw();
    }else if(k==='spread'){
      let sd=1;
      const draw=()=>{const g=curveSVG(sd);
        el.querySelector('.iv').innerHTML=`<svg viewBox="0 0 ${g.W} ${g.H}">${g.shadeSeg(-2*sd,2*sd,COL.teal)}<path d="${g.d}" fill="none" stroke="${COL.ink}" stroke-width="1.6"/></svg>`;
        el.querySelector('.iz').textContent=sd.toFixed(1);};
      el.innerHTML=`<div class="iact-t">▶ 動かせる図：ばらつき(σ)と±2σの範囲</div><div class="iv"></div><div class="ir">ばらつき σ = <b class="iz"></b><input type="range" min="0.6" max="2.4" step="0.05" value="${sd}"></div><div class="ihint">σを変えると山の幅は変わりますが、色のついた「±2σ」の範囲には、いつも全体の約95%が入ります。これが基準範囲の考え方です。</div>`;
      el.querySelector('input').oninput=e=>{sd=+e.target.value;draw();};draw();
    }else if(k==='nnt'){
      el.innerHTML=`<div class="iact-t">▶ 計算してみる：NNT(治療必要数)</div><div class="nntrow"><label>対照群リスク(%)<br><input type="number" class="cr" value="20" min="0" max="100"></label><label>治療群リスク(%)<br><input type="number" class="tr" value="10" min="0" max="100"></label></div><div class="ip" style="margin-top:10px"></div><div class="ihint">同じ「相対的に半減」でも、もとのリスクが高いほどNNTは小さく（効率的に）なります。数値を変えて確かめてみてください。</div>`;
      const calc=()=>{const cr=+el.querySelector('.cr').value/100,tr=+el.querySelector('.tr').value/100,rr=tr/cr,arr=cr-tr,nnt=1/Math.abs(arr);
        el.querySelector('.ip').innerHTML=`相対リスク RR ≈ ${isFinite(rr)?rr.toFixed(2):'—'}　/　絶対リスク減少 ARR ≈ ${(arr*100).toFixed(1)}%　/　NNT ≈ ${isFinite(nnt)&&arr!==0?Math.ceil(nnt):'—'}`;};
      el.querySelectorAll('input').forEach(i=>i.oninput=calc);calc();
    }
  });
  const gw=document.getElementById('glossWrap');if(gw)buildGloss(gw);
}

  const q=c.querySelector('#gq'),list=c.querySelector('#glist');
  const draw=f=>{const ff=(f||'').trim();list.innerHTML=GLOSS.filter(g=>!ff||g.t.indexOf(ff)>=0||g.d.indexOf(ff)>=0).map(g=>`<div class="gitem${pendingTerm&&g.t===pendingTerm?' gflash':''}"><div class="gt">${g.t}</div><div class="gd">${md(g.d)}</div></div>`).join('')||'<div class="gd">該当する用語がありません。</div>';};
  q.oninput=()=>{pendingTerm='';draw(q.value);};
  if(pendingTerm){q.value=pendingTerm;draw(pendingTerm);}else draw('');
}
function gotoTerm(t){pendingTerm=t;cur=GIDX;render();window.scrollTo(0,0);}
function wireLinks(){document.querySelectorAll('.lk').forEach(s=>s.onclick=()=>gotoTerm(s.dataset.term));}

/* ---- render ---- */
let cur=0;
function render(){
  const nav=document.getElementById("nav");
  nav.innerHTML=CH.map((c,i)=>`<button class="tab${i===cur?' on':''}" data-i="${i}">${c.t.split(".")[0]}</button>`).join("");
  nav.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render();window.scrollTo(0,0);});
  document.getElementById("art").innerHTML=`<h2>${CH[cur].t}</h2><div class="uline"></div>`+CH[cur].b.map(block).join("")+(EXTRA[cur]||[]).map(block).join("")+(INTERACT[cur]?`<div class="iact" data-kind="${INTERACT[cur]}"></div>`:"")+quizHTML(cur);
  wireQuiz();initInteractives();wireLinks();
  document.getElementById("pg").textContent=(cur+1)+" / "+CH.length;
  document.getElementById("prev").disabled=cur===0;
  document.getElementById("next").disabled=cur===CH.length-1;
}
document.getElementById("prev").onclick=()=>{if(cur>0){cur--;render();window.scrollTo(0,0);}};
document.getElementById("next").onclick=()=>{if(cur<CH.length-1){cur++;render();window.scrollTo(0,0);}};
render();
</script>
</body>
</html>
