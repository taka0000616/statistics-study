<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医学統計学 中級編（理論の土台）</title>
<style>
  :root{--bg:#eef1ee;--paper:#fbfcfa;--ink:#1b2228;--soft:#646b73;--line:#d3d8d3;--red:#8c2d2d;--teal:#26565c;--gold:#9a7820;--green:#356048;--ind:#2f6b56;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",sans-serif;font-size:16px;line-height:1.78;}
  .wrap{max-width:700px;margin:0 auto;padding:20px 16px 70px;}
  header{border-bottom:2px solid var(--ind);padding-bottom:14px;margin-bottom:16px;}
  .kicker{font-size:11px;letter-spacing:2px;color:var(--gold);}
  h1{font-family:Georgia,serif;font-size:26px;margin:2px 0 0;color:var(--ind);}
  .sub{font-size:13px;color:var(--soft);margin:4px 0 0;}
  nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
  .tab{padding:7px 10px;font-size:13px;border-radius:7px;background:transparent;color:var(--soft);border:1px solid var(--line);cursor:pointer;}
  .tab.on{background:var(--ind);color:#fff;border-color:var(--ind);}
  h2{font-family:Georgia,serif;font-size:22px;margin:0 0 2px;color:var(--ind);}
  .uline{width:48px;height:4px;background:var(--gold);margin-bottom:8px;border-radius:2px;}
  p{margin:14px 0;}
  .kw{color:var(--red);font-weight:600;}
  .box{margin:18px 0;border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:9px;background:var(--paper);padding:14px 16px;}
  .box .bt{font-weight:700;font-size:14px;margin-bottom:4px;}
  .box .bb{font-size:14.5px;line-height:1.72;}
  .formula{font-family:ui-monospace,Menlo,Consolas,monospace;background:#e6ebe7;border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin:14px 0;font-size:14px;overflow-x:auto;color:var(--ink);}
  figure{margin:20px 0;}
  .figbox{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;}
  figcaption{font-size:12px;color:var(--soft);margin-top:8px;}
  figcaption b{color:var(--red);}
  svg{display:block;width:100%;height:auto;}
  .rows>div{display:flex;gap:10px;padding:8px;border-radius:6px;background:rgba(0,0,0,.03);margin:5px 0;font-size:14px;}
  .rows .k{font-weight:700;flex:0 0 38%;color:var(--teal);}
  .eg{margin:14px 0;border:1px dashed var(--ind);border-radius:9px;background:rgba(47,107,86,.06);padding:12px 14px;font-size:13.5px;}
  .eg .et{font-weight:700;color:var(--ind);font-size:13px;margin-bottom:4px;letter-spacing:.5px;}
  .navbtns{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding-top:14px;border-top:1px solid var(--line);}
  .navbtns button{background:none;border:none;color:var(--teal);font-size:14px;cursor:pointer;font-family:inherit;}
  .navbtns button:disabled{opacity:.3;}
  .pg{font-size:12px;color:var(--soft);}
  footer{margin-top:26px;text-align:center;font-size:12px;color:var(--soft);}
  .gl{border-bottom:1px dotted var(--teal);cursor:pointer;}
  .gldef{display:inline-block;margin:5px 0;padding:7px 11px;background:rgba(38,86,92,.09);border-left:3px solid var(--teal);border-radius:7px;font-size:12.5px;line-height:1.62;color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">MEDICAL BIOSTATISTICS · INTERMEDIATE</div>
    <h1>医学統計学 中級編</h1>
    <p class="sub">理論の土台 ― 検定と推定はなぜ成り立つのか</p>
  </header>
  <nav id="nav"></nav>
  <article id="art"></article>
  <div class="navbtns"><button id="prev">← 前の章</button><span class="pg" id="pg"></span><button id="next">次の章 →</button></div>
  <footer>初学者向け「図解テキスト」と研究者向け「上級編」の橋渡しです。点線の付いた専門用語はタップすると平易な定義が出ます。</footer>
</div>
<script>
const COL={ink:"#1b2228",soft:"#646b73",line:"#d3d8d3",red:"#8c2d2d",teal:"#26565c",gold:"#9a7820",green:"#356048",ind:"#2f6b56"};
const TL=COL.teal,R=COL.red,G=COL.green,GD=COL.gold,SF=COL.soft,L=COL.line,IK=COL.ink,IN=COL.ind;
function scaler(xd,yd,W,H,pad){const[x0,x1]=xd,[y0,y1]=yd;return{x:v=>pad+(v-x0)/(x1-x0)*(W-2*pad),y:v=>H-pad-(v-y0)/(y1-y0)*(H-2*pad)};}
function path(p,sc){return p.map((q,i)=>(i?'L':'M')+sc.x(q[0]).toFixed(1)+' '+sc.y(q[1]).toFixed(1)).join(' ');}

/* ===== figures ===== */
function fCLT(){const W=320,H=165,sc=scaler([0,9],[0,1.2],W,H,24),mean=3.3,popsd=2.0;
 const ln=x=>x<=0?0:Math.exp(-Math.pow(Math.log(x)-1.0,2)/0.72)/(x*0.6*2.5066);
 const nm=(x,sd)=>Math.exp(-Math.pow(x-mean,2)/(2*sd*sd))/(sd*2.5066);
 const par=[],n5=[],n30=[];
 for(let x=0.05;x<=9;x+=0.1)par.push([x,ln(x)]);
 for(let x=0;x<=9;x+=0.08){n5.push([x,nm(x,popsd/Math.sqrt(5))]);n30.push([x,nm(x,popsd/Math.sqrt(30))]);}
 return `<svg viewBox="0 0 ${W} ${H}"><path d="${path(par,sc)}" fill="${SF}" fill-opacity=".14" stroke="${SF}" stroke-width="1.6"/><path d="${path(n5,sc)}" fill="none" stroke="${TL}" stroke-width="1.9"/><path d="${path(n30,sc)}" fill="none" stroke="${R}" stroke-width="2.1"/><text x="${sc.x(6.9)}" y="${sc.y(0.2)}" font-size="9" fill="${SF}">元データ(右に歪む)</text><text x="${sc.x(6.0)}" y="${sc.y(0.5)}" font-size="9" fill="${TL}">n=5の平均</text><text x="${sc.x(4.6)}" y="${sc.y(1.06)}" font-size="9" fill="${R}">n=30の平均</text><text x="${sc.x(4.5)}" y="${H-6}" font-size="9" fill="${SF}" text-anchor="middle">値 →</text></svg>`;}
function fSE(){const W=320,H=160,sc=scaler([0,100],[0,1.05],W,H,30),p=[];for(let n=1;n<=100;n++)p.push([n,1/Math.sqrt(n)]);
 let m='';[4,16,64].forEach(n=>{const y=1/Math.sqrt(n);m+=`<circle cx="${sc.x(n)}" cy="${sc.y(y)}" r="3" fill="${R}"/><text x="${sc.x(n)+4}" y="${sc.y(y)-3}" font-size="8.5" fill="${R}">n=${n}</text>`;});
 return `<svg viewBox="0 0 ${W} ${H}"><path d="${path(p,sc)}" fill="none" stroke="${TL}" stroke-width="2"/>${m}<text x="${sc.x(50)}" y="${H-6}" font-size="9" fill="${SF}" text-anchor="middle">人数 n →</text><text x="6" y="18" font-size="9" fill="${SF}">標準誤差(相対)</text></svg>`;}
function fT(){const W=320,H=150,sc=scaler([-4,4],[0,0.42],W,H,18),nm=x=>Math.exp(-x*x/2)/2.5066,tp=x=>(2/(Math.sqrt(3)*Math.PI))*Math.pow(1+x*x/3,-2),a=[],b=[];
 for(let x=-4;x<=4;x+=0.1){a.push([x,nm(x)]);b.push([x,tp(x)]);}
 return `<svg viewBox="0 0 ${W} ${H}"><path d="${path(a,sc)}" fill="none" stroke="${SF}" stroke-width="1.6" stroke-dasharray="4 3"/><path d="${path(b,sc)}" fill="none" stroke="${R}" stroke-width="2.1"/><text x="${sc.x(1.1)}" y="${sc.y(0.36)}" font-size="9" fill="${SF}">正規分布</text><text x="${sc.x(1.7)}" y="${sc.y(0.11)}" font-size="9" fill="${R}">t分布(自由度3)は裾が重い</text><text x="${sc.x(0)}" y="${H-5}" font-size="9" fill="${SF}" text-anchor="middle">標準化した値 →</text></svg>`;}
function fDistMap(){const node=(x,y,t,c)=>`<rect x="${x-34}" y="${y-13}" width="68" height="26" rx="6" fill="#fff" stroke="${c}" stroke-width="1.4"/><text x="${x}" y="${y+4}" font-size="10" fill="${IK}" text-anchor="middle">${t}</text>`;
 const ar=(x1,y1,x2,y2,t)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${SF}" stroke-width="1.3" marker-end="url(#dm)"/>`+(t?`<text x="${(x1+x2)/2}" y="${(y1+y2)/2-3}" font-size="8" fill="${SF}" text-anchor="middle">${t}</text>`:'');
 return `<svg viewBox="0 0 320 185"><defs><marker id="dm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="${SF}"/></marker></defs>
  ${node(58,32,"二項分布",TL)}${node(58,92,"ポアソン分布",TL)}${node(160,62,"正規分布",R)}${node(264,26,"カイ二乗分布",GD)}${node(264,92,"t分布",G)}${node(264,154,"F分布",GD)}
  ${ar(92,36,126,56,"n大")}${ar(92,88,126,68,"λ大")}
  ${ar(194,52,230,32,"二乗和")}${ar(194,68,230,88,"σ推定")}${ar(290,38,290,142,"比")}
  <text x="160" y="178" font-size="8.5" fill="${SF}" text-anchor="middle">正規分布が結節点。そこからカイ二乗・t・Fが派生する</text></svg>`;}
function fChi(){const W=320,H=150,sc=scaler([0,12],[0,0.5],W,H,24),f=x=>0.5*Math.exp(-x/2),p=[];for(let x=0;x<=12;x+=0.1)p.push([x,f(x)]);
 const crit=5.99,seg=p.filter(q=>q[0]>=crit);let area='M'+sc.x(crit)+' '+sc.y(0);seg.forEach(q=>area+=' L'+sc.x(q[0]).toFixed(1)+' '+sc.y(q[1]).toFixed(1));area+=' L'+sc.x(12)+' '+sc.y(0)+' Z';
 return `<svg viewBox="0 0 ${W} ${H}"><path d="${area}" fill="${R}" fill-opacity=".2"/><path d="${path(p,sc)}" fill="none" stroke="${TL}" stroke-width="2"/><line x1="${sc.x(crit)}" y1="${sc.y(0)}" x2="${sc.x(crit)}" y2="${sc.y(0.34)}" stroke="${R}" stroke-dasharray="3 3"/><text x="${sc.x(crit)+3}" y="${sc.y(0.32)}" font-size="9" fill="${R}">棄却域(右の裾)</text><text x="${sc.x(6)}" y="${H-5}" font-size="9" fill="${SF}" text-anchor="middle">χ²の値 → (ズレが大きいほど右へ)</text></svg>`;}
function fANOVA(){const W=320,H=160,sc=scaler([0,4],[0,10],W,H,24),grand=5;
 const groups=[{x:1,m:3,pts:[2.4,3.0,3.5,2.7,3.3]},{x:2,m:5,pts:[4.5,5.2,4.8,5.5,5.0]},{x:3,m:7,pts:[6.4,7.1,6.8,7.4,6.9]}];
 let dots='',means='';groups.forEach(g=>{g.pts.forEach((v,i)=>{dots+=`<circle cx="${sc.x(g.x)+(i-2)*5}" cy="${sc.y(v)}" r="2.4" fill="${TL}" opacity=".7"/>`;});means+=`<line x1="${sc.x(g.x)-16}" y1="${sc.y(g.m)}" x2="${sc.x(g.x)+16}" y2="${sc.y(g.m)}" stroke="${R}" stroke-width="2"/>`;});
 return `<svg viewBox="0 0 ${W} ${H}"><line x1="${sc.x(0.4)}" y1="${sc.y(grand)}" x2="${sc.x(3.6)}" y2="${sc.y(grand)}" stroke="${SF}" stroke-dasharray="4 3"/><text x="${sc.x(3.6)}" y="${sc.y(grand)-3}" font-size="8.5" fill="${SF}" text-anchor="end">全体平均</text>${dots}${means}<text x="${sc.x(1)}" y="${H-6}" font-size="8.5" fill="${SF}" text-anchor="middle">群1</text><text x="${sc.x(2)}" y="${H-6}" font-size="8.5" fill="${SF}" text-anchor="middle">群2</text><text x="${sc.x(3)}" y="${H-6}" font-size="8.5" fill="${SF}" text-anchor="middle">群3</text><text x="6" y="16" font-size="8.5" fill="${R}">赤=群平均</text></svg>`;}
function fRank(){const W=320,H=130,sc=scaler([0,11],[0,1],W,H,20);
 const vals=[{v:1.2,r:1,g:0},{v:2.0,r:2,g:1},{v:2.6,r:3,g:0},{v:3.1,r:4,g:1},{v:4.0,r:5,g:0},{v:5.2,r:6,g:1},{v:9.5,r:7,g:0}];
 let s='';vals.forEach(d=>{const xa=sc.x(d.v),xb=sc.x(d.r*1.3),col=d.g?R:TL;
  s+=`<circle cx="${xa}" cy="${sc.y(0.8)}" r="3.2" fill="${col}"/><circle cx="${xb}" cy="${sc.y(0.25)}" r="3.2" fill="${col}"/><line x1="${xa}" y1="${sc.y(0.76)}" x2="${xb}" y2="${sc.y(0.29)}" stroke="${L}" stroke-width="0.8"/><text x="${xb}" y="${sc.y(0.05)}" font-size="8" fill="${SF}" text-anchor="middle">${d.r}</text>`;});
 return `<svg viewBox="0 0 ${W} ${H}"><text x="4" y="${sc.y(0.8)+4}" font-size="8.5" fill="${SF}">実値</text><text x="4" y="${sc.y(0.25)+4}" font-size="8.5" fill="${SF}">順位</text>${s}<text x="${sc.x(8.6)}" y="${sc.y(0.96)}" font-size="8" fill="${SF}" text-anchor="middle">外れ値も順位7に圧縮</text></svg>`;}
function fReg(){const W=320,H=160,sc=scaler([0,10],[0,10],W,H,24);
 const pts=[[1,2.2],[2,2.8],[3,4.1],[4,3.9],[5,5.6],[6,5.2],[7,7.0],[8,6.8],[9,8.4]],a=1.4,b=0.78,line=[[0,a],[10,a+b*10]];
 let res='';pts.forEach(p=>{const yhat=a+b*p[0];res+=`<line x1="${sc.x(p[0])}" y1="${sc.y(p[1])}" x2="${sc.x(p[0])}" y2="${sc.y(yhat)}" stroke="${GD}" stroke-width="1"/>`;});
 const dots=pts.map(p=>`<circle cx="${sc.x(p[0])}" cy="${sc.y(p[1])}" r="3" fill="${TL}"/>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}">${res}<path d="${path(line,sc)}" stroke="${R}" stroke-width="2" fill="none"/>${dots}<text x="${sc.x(6.8)}" y="${sc.y(8.6)}" font-size="9" fill="${R}">回帰直線</text><text x="${sc.x(3.3)}" y="${sc.y(2.9)}" font-size="8.5" fill="${GD}">残差(縦のズレ)</text><text x="${sc.x(5)}" y="${H-5}" font-size="9" fill="${SF}" text-anchor="middle">x →</text></svg>`;}
function fMLE(){const W=320,H=150,sc=scaler([0,10],[0,1],W,H,22),f=x=>Math.exp(-Math.pow(x-6,2)/(2*1.4*1.4)),p=[];for(let x=0;x<=10;x+=0.1)p.push([x,f(x)]);
 const peak=6;return `<svg viewBox="0 0 ${W} ${H}"><path d="${path(p,sc)}" fill="${TL}" fill-opacity=".12" stroke="${TL}" stroke-width="2"/><line x1="${sc.x(peak)}" y1="${sc.y(0)}" x2="${sc.x(peak)}" y2="${sc.y(1)}" stroke="${R}" stroke-dasharray="3 3"/><circle cx="${sc.x(peak)}" cy="${sc.y(1)}" r="3.5" fill="${R}"/><text x="${sc.x(peak)+5}" y="${sc.y(0.94)}" font-size="9" fill="${R}">最尤推定値(尤度が最大)</text><text x="${sc.x(5)}" y="${H-5}" font-size="9" fill="${SF}" text-anchor="middle">パラメータ θ →</text><text x="6" y="16" font-size="9" fill="${SF}">尤度</text></svg>`;}
function fPower(){const W=320,H=160,sc=scaler([-4,7],[0,0.42],W,H,18),nm=(x,m)=>Math.exp(-Math.pow(x-m,2)/2)/2.5066,h0=[],h1=[],c=1.645;
 for(let x=-4;x<=7;x+=0.1){h0.push([x,nm(x,0)]);h1.push([x,nm(x,3)]);}
 const aSeg=h0.filter(q=>q[0]>=c);let aA='M'+sc.x(c)+' '+sc.y(0);aSeg.forEach(q=>aA+=' L'+sc.x(q[0]).toFixed(1)+' '+sc.y(q[1]).toFixed(1));aA+=' L'+sc.x(7)+' '+sc.y(0)+' Z';
 const bSeg=h1.filter(q=>q[0]<=c);let bA='M'+sc.x(-4)+' '+sc.y(0);bSeg.forEach(q=>bA+=' L'+sc.x(q[0]).toFixed(1)+' '+sc.y(q[1]).toFixed(1));bA+=' L'+sc.x(c)+' '+sc.y(0)+' Z';
 return `<svg viewBox="0 0 ${W} ${H}"><path d="${bA}" fill="${SF}" fill-opacity=".25"/><path d="${aA}" fill="${R}" fill-opacity=".3"/><path d="${path(h0,sc)}" fill="none" stroke="${SF}" stroke-width="1.8"/><path d="${path(h1,sc)}" fill="none" stroke="${TL}" stroke-width="1.8"/><line x1="${sc.x(c)}" y1="${sc.y(0)}" x2="${sc.x(c)}" y2="${sc.y(0.41)}" stroke="${IK}" stroke-dasharray="3 3"/><text x="${sc.x(0)}" y="${sc.y(0.41)}" font-size="9" fill="${SF}" text-anchor="middle">差なし(H0)</text><text x="${sc.x(3)}" y="${sc.y(0.41)}" font-size="9" fill="${TL}" text-anchor="middle">差あり(H1)</text><text x="${sc.x(2.5)}" y="${sc.y(0.05)}" font-size="8" fill="${R}">α</text><text x="${sc.x(0.6)}" y="${sc.y(0.05)}" font-size="8" fill="${SF}">β</text><text x="${sc.x(1.5)}" y="${H-4}" font-size="8.5" fill="${SF}" text-anchor="middle">検出力 = 1 − β (H1の右側)</text></svg>`;}
function fCI(){const W=320,H=180,sc=scaler([-3,3],[0,1],W,H,16);
 const ci=[[0.1,1.0],[-0.6,1.0],[0.5,0.9],[-0.2,1.1],[1.3,0.9],[-0.4,1.0],[0.3,1.2],[-1.0,0.8],[0.0,1.0],[0.7,0.9],[-0.5,1.0],[0.4,1.1]];
 let s='';const n=ci.length;
 ci.forEach((c,i)=>{const y=H-16-(i+0.5)/n*(H-34);const lo=c[0]-c[1],hi=c[0]+c[1];const miss=lo>0||hi<0;const col=miss?R:TL;
  s+=`<line x1="${sc.x(lo)}" y1="${y.toFixed(1)}" x2="${sc.x(hi)}" y2="${y.toFixed(1)}" stroke="${col}" stroke-width="2"/><circle cx="${sc.x(c[0])}" cy="${y.toFixed(1)}" r="2" fill="${col}"/>`;});
 return `<svg viewBox="0 0 ${W} ${H}"><line x1="${sc.x(0)}" y1="8" x2="${sc.x(0)}" y2="${H-10}" stroke="${IK}" stroke-dasharray="4 3"/><text x="${sc.x(0)+4}" y="14" font-size="9" fill="${IK}">真の値</text>${s}<text x="6" y="${H-3}" font-size="8.5" fill="${R}">赤=真の値を外した区間(約5%)</text></svg>`;}
function fPval(){const W=320,H=150,sc=scaler([-4,4],[0,0.42],W,H,18),nm=x=>Math.exp(-x*x/2)/2.5066,p=[];for(let x=-4;x<=4;x+=0.1)p.push([x,nm(x)]);
 const obs=2.1,seg=p.filter(q=>q[0]>=obs);let a='M'+sc.x(obs)+' '+sc.y(0);seg.forEach(q=>a+=' L'+sc.x(q[0]).toFixed(1)+' '+sc.y(q[1]).toFixed(1));a+=' L'+sc.x(4)+' '+sc.y(0)+' Z';
 const seg2=p.filter(q=>q[0]<=-obs);let a2='M'+sc.x(-4)+' '+sc.y(0);seg2.forEach(q=>a2+=' L'+sc.x(q[0]).toFixed(1)+' '+sc.y(q[1]).toFixed(1));a2+=' L'+sc.x(-obs)+' '+sc.y(0)+' Z';
 return `<svg viewBox="0 0 ${W} ${H}"><path d="${a}" fill="${R}" fill-opacity=".25"/><path d="${a2}" fill="${R}" fill-opacity=".25"/><path d="${path(p,sc)}" fill="none" stroke="${TL}" stroke-width="2"/><line x1="${sc.x(obs)}" y1="${sc.y(0)}" x2="${sc.x(obs)}" y2="${sc.y(0.3)}" stroke="${R}" stroke-dasharray="3 3"/><text x="${sc.x(obs)+3}" y="${sc.y(0.28)}" font-size="9" fill="${R}">観測した統計量</text><text x="${sc.x(0)}" y="${sc.y(0.41)}" font-size="9" fill="${SF}" text-anchor="middle">差がない世界(H0)の分布</text><text x="${sc.x(0)}" y="${H-4}" font-size="8.5" fill="${SF}" text-anchor="middle">両裾の塗りの合計 = p値</text></svg>`;}
function fBayes(){const W=320,H=155,sc=scaler([0,10],[0,1.05],W,H,18);
 const g=(m,sd,h)=>{const a=[];for(let x=0;x<=10;x+=0.1)a.push([x,h*Math.exp(-Math.pow(x-m,2)/(2*sd*sd))]);return a;};
 const pri=g(4,2.2,0.55),lik=g(7,1.1,1.0),pos=g(6.4,0.95,1.0);
 return `<svg viewBox="0 0 ${W} ${H}"><path d="${path(pri,sc)}" fill="none" stroke="${SF}" stroke-width="1.8" stroke-dasharray="5 3"/><path d="${path(lik,sc)}" fill="none" stroke="${GD}" stroke-width="1.8"/><path d="${path(pos,sc)}" fill="${R}" fill-opacity=".12" stroke="${R}" stroke-width="2.1"/><text x="${sc.x(2.0)}" y="${sc.y(0.62)}" font-size="9" fill="${SF}">事前分布</text><text x="${sc.x(8.2)}" y="${sc.y(0.72)}" font-size="9" fill="${GD}">尤度(データ)</text><text x="${sc.x(6.4)}" y="${sc.y(1.05)}" font-size="9" fill="${R}" text-anchor="middle">事後分布</text><text x="${sc.x(5)}" y="${H-4}" font-size="9" fill="${SF}" text-anchor="middle">パラメータ →</text></svg>`;}

/* ===== glossary (tap a highlighted term to see a plain definition) ===== */
const GLOSS={
"中心極限定理":"元データがどんな形でも、標本平均を多数集めるとその分布が正規分布に近づく性質。",
"標本平均":"標本から計算した平均。多数集めると正規分布に近づく。",
"標本分布":"ある統計量(平均など)を繰り返し計算したときの、その値の分布。",
"標準偏差":"データそのもののばらつきの大きさ(SD)。nを増やしても基本的に縮まない。",
"標準誤差":"平均などの推定値の不確かさ(SE)。SD÷√n で、nを増やすと縮む。",
"自由度":"自由に動ける情報の数。n個から平均を1つ推定するとn−1。分布の形を決める。",
"t分布":"正規分布に似た釣鐘型だが裾が重い。σを推定する不確かさを織り込んだ分布。",
"対応のあるt検定":"同じ対象の前後など、ペアになった2群の平均を比べる検定。",
"二標本t検定":"独立した2群の平均を比べる検定。",
"Welchのt検定":"2群の分散が等しいと仮定しないt検定。既定で使ってよい安全策。",
"二項分布":"成功/失敗をn回繰り返したときの成功数の分布。発症あり/なしの土台。",
"ポアソン分布":"一定期間に稀な出来事が何回起きるかの分布。件数や発生率の土台。",
"正規分布":"左右対称の釣鐘型。多くの平均値が従う。各分布の結節点。",
"カイ二乗分布":"正規変数の二乗和が従う分布。分割表やばらつきの検定に登場。",
"カイ二乗検定":"カテゴリ同士の関連を、観測度数と期待度数のズレで調べる検定。",
"F分布":"2つのばらつきの比が従う分布。分散分析(ANOVA)の土台。",
"期待度数":"関連がない(独立)と仮定したとき、各マスに来るはずの人数。",
"Fisherの正確検定":"期待度数が小さいときに使う、近似に頼らない正確な検定。",
"多重性":"たくさん検定するほど偽陽性が積み上がる問題。",
"分散分析":"3群以上の平均差を、群間と群内のばらつきの比で一度に検定する手法(ANOVA)。",
"群間のばらつき":"群の平均どうしがどれだけ開いているか。大きいほど差ありの証拠。",
"群内のばらつき":"同じ群の中での散らばり。これに比べて群間が大きいかを見る。",
"F比":"群間のばらつきを群内のばらつきで割った値。大きいほど平均に差。",
"多重比較":"どの群間に差があるかを、検定数を考慮して調整しつつ調べる方法(Tukeyなど)。",
"ノンパラメトリック検定":"分布の形を仮定せず、順位に基づいて比べる頑健な検定群。",
"順位":"値を大きさの順に並べた番号。極端な外れ値の影響を受けにくい。",
"相関":"2つの量が一緒に動く度合い(−1〜+1)。因果ではない。",
"回帰":"一方の変数から他方を予測・説明する手法。直線なら単回帰。",
"残差":"各データ点と回帰直線との、縦方向のズレ。",
"最小二乗法":"残差の二乗和が最小になるように直線を当てはめる方法。",
"決定係数":"yのばらつきのうち回帰で説明できた割合(R²、0〜1)。",
"最尤推定":"手元のデータが最も起こりやすくなるパラメータを選ぶ推定原理(MLE)。",
"尤度":"あるパラメータのもとでデータが生じる起こりやすさ。最大化する点がMLE。",
"検出力":"本当に差があるとき、それを見つけられる確率(1−β)。通常0.8以上を目標。",
"効果量":"差の大きさそのものを表す指標。p値とは別に重要。",
"サンプルサイズ設計":"必要な人数を、効果量・α・検出力・ばらつきから逆算すること。",
"等分散":"群どうしのばらつき(分散)が等しい、という前提。",
"信頼区間":"同じ方法で推定を繰り返すと、その何%(普通95%)かが真の値を含む区間。",
"点推定":"1つの値で示す推定(平均など)。幅で示す区間推定と対になる。",
"帰無仮説":"差がない・効果がない、と仮に置く仮説(H0)。これを棄却できるか試す。",
"対立仮説":"差がある・効果がある、という主張側の仮説(H1)。",
"p値":"差がない世界(H0)で、観測した以上の偏りが起きる確率。小さいほどH0が苦しい。",
"第一種の過誤":"差がないのに有意としてしまう誤り(偽陽性、確率α)。",
"第二種の過誤":"差があるのに見逃す誤り(偽陰性、確率β)。",
"事前分布":"データを見る前の、パラメータについての信念を表す分布(ベイズ)。",
"事後分布":"事前分布をデータ(尤度)で更新した、最終的な信念の分布。",
"ベイズの定理":"事後 ∝ 尤度 × 事前。データで信念を更新する規則。",
"信用区間":"事後分布から作る区間。『95%の確率で真の値がこの中』と直接言える。",
"交絡":"原因とも結果とも関わる第三の要因が、見かけの関連を歪めること。",
"層別解析":"交絡要因のレベルごとに分けて解析し、その影響を取り除く方法。",
"標準化":"集団の年齢構成などをそろえて、公平に比較できるよう調整すること。",
"シンプソンのパラドックス":"層別すると、全体で見た関連と逆向きの関連が現れる現象。",
"カプランマイヤー法":"打ち切りを考慮し、生存率を階段状に推定する方法。",
"打ち切り":"観察終了や脱落で、イベントが起きたか最後まで分からないこと。",
"ログランク検定":"2群以上の生存曲線全体に差があるかを調べる検定。",
"ハザード":"その瞬間にイベントが起きる勢い(瞬間発生率)。",
"ハザード比":"2群のハザードの比。1なら差なし、1未満なら起こりにくい。",
"感度":"病気の人を正しく陽性と判定できる割合(見逃しの少なさ)。",
"特異度":"健康な人を正しく陰性と判定できる割合(過剰診断の少なさ)。",
"陽性的中率":"陽性と出た人のうち、本当に病気である割合。有病率に左右される。",
"ROC曲線":"閾値を動かしたときの感度と偽陽性率の軌跡。左上ほど良い。",
"AUC":"ROC曲線の下の面積。1に近いほど判別性能が高い(0.5は偶然)。",
"交互作用":"ある要因の効果が、別の要因の値によって変わること(効果の修飾)。",
"多重共線性":"説明変数どうしが強く相関し、各係数の推定が不安定になる現象。",
"ランダム化比較試験":"対象を無作為に群分けする試験(RCT)。交絡を平均的にそろえられる最強の設計。",
"コホート研究":"曝露あり/なしを追跡し、将来の発症を比べる前向き観察研究。",
"症例対照研究":"発症した人(症例)と発症していない人(対照)で、過去の曝露を比べる研究。",
"横断研究":"曝露とアウトカムをある一時点で同時に調べる研究。因果の前後が不明。",
"選択バイアス":"対象の選ばれ方が偏ることで、見かけの関連が歪む誤り。",
"情報バイアス":"曝露やアウトカムの測定・分類の誤りから生じる偏り。",
"思い出しバイアス":"過去の曝露を、患者が病気の有無で違って思い出すことによる偏り。",
"リスク比":"曝露群の発症割合を非曝露群で割った値(相対危険度、RR)。",
"オッズ比":"オッズ(起こる/起こらない)の比。症例対照研究やロジスティック回帰で使う。",
"絶対リスク減少":"2群の発症割合の差(ARR)。実際にどれだけ減ったかを示す絶対指標。",
"治療必要数":"1人の発症を防ぐのに何人治療が要るか(NNT=1÷絶対リスク減少)。",
"κ係数":"カテゴリ判定の一致度を、偶然の一致を差し引いて測る指標(0〜1)。",
"欠測":"本来あるべきデータが記録されていないこと。扱いを誤ると偏りの元。",
"MCAR":"完全にランダムな欠測。欠けるかどうかが何とも関係しない理想的な場合。",
"MAR":"観測済みの他の変数で説明できる欠測。適切な手法で補正可能。",
"MNAR":"欠けた値そのものに依存する欠測(重症ほど来院しないなど)。最も厄介。",
"多重代入":"欠測を複数通り埋めて解析し、不確かさも反映して統合する方法。",
"率比":"単位時間あたりの発生率の比(率比、IRR)。人年あたりで比べる。",
"人年":"観察人数×追跡時間の合計。1人を1年追えば1人年。率の分母になる。",
"ブートストラップ":"手元のデータから復元抽出を繰り返し、推定値のばらつきを実験的に求める方法。",
"リサンプリング":"データを取り直す代わりに、手元の標本から再抽出して不確かさを評価する考え方。",
"てこ比":"説明変数の値が極端な点ほど回帰直線を強く引っぱる度合い(レバレッジ)。",
"過分散":"ポアソンなどの想定よりデータのばらつきが大きい状態。標準誤差を過小評価しがち。",
"対数変換":"右に歪んだ量の対数をとり、分布を対称に近づける変換。",
"平滑化スプライン":"直線にこだわらず、曲線で滑らかに関係を表す柔軟な当てはめ。"
};
function gloss(w){for(var k in GLOSS){if(w.indexOf(k)>=0)return GLOSS[k];}return null;}

/* ===== markup ===== */
function md(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\*\*([^*]+)\*\*/g,function(m,w){var d=gloss(w);return d?'<span class="kw gl" data-d="'+d+'">'+w+'</span>':'<strong class="kw">'+w+'</strong>';}).replace(/\n/g,"<br>");}
function block(b){
 if(b.p)return `<p>${md(b.p)}</p>`;
 if(b.box)return `<div class="box" style="border-left-color:${b.box.c||TL}"><div class="bt" style="color:${b.box.c||TL}">${md(b.box.t)}</div><div class="bb">${md(b.box.b)}</div></div>`;
 if(b.fig)return `<figure><div class="figbox">${FIGS[b.fig.html]?FIGS[b.fig.html]():''}</div><figcaption><b>図${b.fig.n}.</b> ${md(b.fig.cap)}</figcaption></figure>`;
 if(b.formula)return `<div class="formula">${b.formula}</div>`;
 if(b.eg)return `<div class="eg"><div class="et">論文・実務での見え方</div>${md(b.eg)}</div>`;
 if(b.rows)return `<div class="rows">`+b.rows.map(r=>`<div><span class="k">${r[0]}</span><span>${md(r[1])}</span></div>`).join("")+`</div>`;
 return "";
}

 {fig:{n:"8-1",cap:"散布図と回帰直線(赤)。各点から直線までの縦のズレ(金=残差)の二乗和が最小になるように直線を引く。",html:"fReg"}},
 {p:"回帰直線は、各点から直線までの縦のズレ——**残差**——の二乗和が最小になるように引きます(**最小二乗法**)。当てはまりの良さは**決定係数**R²(0〜1、yのばらつきのうち何割を説明できたか)で測ります。"},
 {box:{t:"よくある落とし穴",c:R,b:"相関は因果ではありません(交絡の可能性)。またrは**直線関係**の強さで、曲がった関係や外れ値に弱い。必ず散布図を見ること。R²が高くても予測が当たるとは限らず、外れ値1点でr・傾きは大きく動きます。"}},
 {box:{t:"多変量への入り口",c:TL,b:"説明変数が複数になれば重回帰、結果が二値ならロジスティック回帰……と、回帰は交絡の調整や予測の土台へ広がります。ここから先が上級編の世界です。"}},
 {eg:"「BMIとHbA1cは正の相関(r=0.42, p<0.001)。単回帰でBMI1増加あたりHbA1cが0.08%上昇(95%CI 0.05–0.11, R²=0.18)。」"}
]},
{t:"9. 最尤推定の考え方",b:[
 {p:"t検定や回帰の裏側で、パラメータ(平均・傾きなど)を求める最も標準的な原理が**最尤推定**(MLE)です。考え方は素直で、『手元の**データが最も起こりやすくなる**ようなパラメータを選ぶ』というもの。"},
 {p:"その『起こりやすさ』を、パラメータの関数として表したのが**尤度**です。尤度を最大にする点がMLE——図でいえば山の頂上です。多くの場面で、MLEは平均や割合といった見慣れた推定値とぴたりと一致します。"},
 {fig:{n:"9-1",cap:"パラメータθを動かしたときの尤度。データが最も起こりやすくなる頂上(赤)が最尤推定値。山が尖るほど推定は精密。",html:"fMLE"}},
 {formula:"尤度 L(θ) = 観測データが θ のもとで生じる確率(の積)\n最尤推定値 = L(θ) を最大にする θ"},
 {box:{t:"なぜ重要か",c:TL,b:"ロジスティック回帰・Cox回帰・混合モデルなど、式を直接は解けない手法はみな最尤推定(やその親戚)で係数を求めます。尤度はモデル比較(AICや尤度比検定)の土台にもなります。山の尖り具合が推定の精度(標準誤差)に対応する、というのも効きどころです。"}},
 {box:{t:"混同しやすい点",c:R,b:"尤度は『データが起こる確率』であって、『パラメータが正しい確率』ではありません(後者はベイズの事後確率)。ここはp値の誤解とまったく同じ落とし穴です。"}},
 {eg:"「ロジスティック回帰の係数は最尤法で推定し、モデル全体の有意性は尤度比検定で評価した。」"}
]},
{t:"10. 検出力とサンプルサイズ設計",b:[
 {p:"研究を始める前にいちばん大切な計算が、**サンプルサイズ設計**です。人数が足りなければ、本当は効果があっても見逃します(検出力不足)。逆に多すぎれば、無駄や倫理的な問題が生じます。"},
 {fig:{n:"10-1",cap:"差がない世界(H0, 灰)と差がある世界(H1, 青)。右の濃い塗りがα(偽陽性)、左の薄い塗りがβ(見逃し)。検出力=1−β。",html:"fPower"}},
 {p:"図の2つの山は、『差がない世界(帰無仮説H0)』と『本当に差がある世界(対立仮説H1)』。右の塗りが**α**(第一種の過誤＝差がないのに有意としてしまう確率)、左の塗りが**β**(第二種の過誤＝差を見逃す確率)。そして**検出力**＝1−β(本当の差を見つけられる確率)です。"},
 {formula:"必要人数は次のときほど増える:\n  効果量が小さい / αを厳しくする / 検出力を高くする / ばらつきが大きい"},
 {p:"設計では普通、α=0.05、検出力=0.8(8割)を置き、見込む**効果量**とばらつきから必要人数を逆算します。効果量を楽観的に大きく見積もると、終わってみたら人数が足りなかった、という失敗につながるので注意します。"},
 {box:{t:"終わってからの検出力計算は無意味",c:R,b:"研究が終わってから「有意でなかったのは検出力不足のせい」と事後に検出力を計算するのは、p値の言い換えにすぎず新しい情報を生みません。代わりに**信頼区間の幅**で『どこまで否定できたか』を語るのが正しい姿勢です。"}},
 {box:{t:"実務のひと工夫",c:TL,b:"脱落を見込んで必要数に上乗せします(例:2割脱落なら計算値の約1.25倍)。連続量はt検定ベース、割合はカイ二乗ベース、生存はイベント数ベースと、アウトカムの型で設計式が変わります。"}},
 {eg:"「効果量 d=0.5、両側α=0.05、検出力0.8で各群64例が必要と算出。20%の脱落を見込み、各群80例を登録した。」"}
]},
{t:"11. 信頼区間の本当の意味",b:[
 {p:"p値が『差があるか/ないか』のYes/Noを返すのに対し、**信頼区間**は『差はどのくらいか、その不確かさはどの幅か』を教えてくれます。臨床的な判断には、こちらの方がはるかに有用です。"},
 {p:"ただし意味は誤解されがちです。95%信頼区間とは『この区間に真の値が95%の確率で入る』ことではありません。正しくは、『同じやり方で研究を何度も繰り返せば、作られる区間の95%が真の値を含む』という、手順についての保証です。"},
 {fig:{n:"11-1",cap:"同じ母集団から繰り返し標本をとり、そのつど信頼区間を作ったようす。多く(青)は真の値を含むが、一部(赤)は外す。長い目で見れば約95%が的中する。",html:"fCI"}},
 {formula:"95%信頼区間 ≈ 点推定 ± 1.96 × 標準誤差\n  (平均・割合・比など、推定値の種類で式は変わる)"},
 {p:"区間の**幅**が読みどころです。狭ければ精密、広ければ『まだよく分からない』。区間が無効値(差なら0、比なら1)をまたぐかどうかは、両側p=0.05での有意性とちょうど対応します。"},
 {box:{t:"幅から読み取れること",c:TL,b:"有意でない(区間が0をまたぐ)結果でも、区間が狭ければ『差は小さいと確かに言えた』、広ければ『単に情報不足』と、まったく違う意味になります。**点推定**だけ・p値だけでは、この区別ができません。"}},
 {box:{t:"よくある誤読",c:R,b:"『95%信頼区間に真の値が入る確率は95%』は不正確(真の値は定数で、区間の方がランダム)。確率として直接そう言いたいなら、ベイズの**信用区間**(第13章)が必要です。"}},
 {eg:"「平均差は3.2 kg(95%CI −0.4〜6.8)。有意ではないが区間が広く、効果の有無は結論できなかった。」"}
]},
{t:"12. p値と仮説検定の論理",b:[
 {p:"検定の核心は、いったん『差がない世界』を仮定して、そこから現実がどれだけ外れているかを測ることです。仮定する『差がない』が**帰無仮説**(H0)、示したい『差がある』が**対立仮説**(H1)です。"},
 {p:"**p値**とは、『H0が正しいとして、観測した以上に極端なズレが起きる確率』。これが小さいほど『H0のもとでは起こりにくいことが起きた→H0が疑わしい』と考えます。"},
 {fig:{n:"12-1",cap:"H0(差がない世界)の分布。観測した統計量より外側(両裾)の確率がp値。小さいほど、H0では珍しい出来事が起きたことになる。",html:"fPval"}},
 {p:"判定では2種類の誤りが起こりえます。本当は差がないのに有意としてしまう**第一種の過誤**(確率α、ふつう0.05)と、本当は差があるのに見逃す**第二種の過誤**(確率β)です。両者はトレードオフの関係にあります。"},
 {box:{t:"p値が言っていないこと",c:R,b:"p値は『H0が正しい確率』でも『効果が大きい証拠』でもありません。例えばp=0.04は、仮説が4%しか正しくない、という意味では決してない。大標本では小さな差でもpは小さくなるので、必ず**効果量**と**信頼区間**を併せて見ます。"}},
 {box:{t:"多重比較の罠",c:TL,b:"検定を20回行えば、本当はすべて差がなくても1回くらいは偶然p<0.05が出ます(**多重性**)。多くの項目を調べるときは、Bonferroni法やFDR制御などで基準を補正します。"}},
 {eg:"「主要評価項目はp=0.03で有意。ただし副次項目は多数あり、多重性を補正すると有意水準を下回らなかった。」"}
]},
{t:"13. ベイズの考え方入門",b:[
 {p:"これまでの検定(頻度論)は『パラメータは未知の定数、データがランダム』と考えました。**ベイズの定理**は発想を逆にし、『データは手元の事実、パラメータの方を確率で表す』と考えます。"},
 {p:"出発点は、データを見る前の信念=**事前分布**。そこにデータの**尤度**を掛け合わせて更新したものが、最終的な信念=**事後分布**です。研究とは、事前を事後へと更新する営みだ、と捉え直せます。"},
 {fig:{n:"13-1",cap:"事前分布(灰破線)にデータの尤度(金)を掛けると、両者の中間でより尖った事後分布(赤)が得られる。データが多いほど尤度が勝ち、事前の影響は薄れる。",html:"fBayes"}},
 {formula:"事後分布 ∝ 尤度 × 事前分布\n  P(パラメータ | データ) ∝ P(データ | パラメータ) × P(パラメータ)"},
 {p:"事後分布から作る区間が**信用区間**です。こちらは頻度論の信頼区間と違い、『95%の確率で真の値がこの中にある』と、直感どおりに言えます。これがベイズの大きな利点です。"},
 {box:{t:"長所と注意点",c:TL,b:"事前情報(過去の研究など)を自然に取り込め、少数例や逐次的な更新に強い。一方で**事前分布**の選び方が結果に影響するため、その妥当性と感度分析の明示が欠かせません。"}},
 {box:{t:"頻度論との橋渡し",c:R,b:"データが十分多ければ、事前の影響は薄れ、事後分布は最尤推定(第9章)の周りに集まります。つまり両者は対立というより、情報が増えれば一致していく関係です。"}},
 {eg:"「ベイズ流に解析し、治療効果が臨床的閾値を超える事後確率は92%、95%信用区間は1.2〜4.5であった。」"}
]},
{t:"14. 交絡と層別解析",b:[
 {p:"観察研究で最大の敵が**交絡**です。原因(曝露)とも結果(アウトカム)とも関わる第三の要因があると、見かけの関連が実態とずれてしまいます。喫煙者にコーヒー好きが多ければ、コーヒーと肺がんが『関連あり』に見える、といった具合です。"},
 {p:"対処の基本が**層別解析**。交絡要因のレベルごと(例:喫煙あり/なし)に分けて関連を見れば、その要因の影響を取り除けます。層ごとの結果を重みづけてまとめるのが**Mantel-Haenszel法**です。"},
 {fig:{n:"14-1",cap:"層ごと(青・緑)に見ると右上がりなのに、両者を混ぜた全体(灰破線)では右下がりに見える。層別で関連が逆転する例がシンプソンのパラドックス。",html:"fStrat"}},
 {box:{t:"シンプソンのパラドックス",c:R,b:"**シンプソンのパラドックス**は、全体で見た関連と、層別で見た関連の向きが逆になる現象。どちらが正しいかは、何が交絡かという因果の知識で決まります。データだけ眺めても判定できません。"}},
 {box:{t:"層別の限界と次の一手",c:TL,b:"層別できる交絡要因はせいぜい数個まで。多くの要因を同時に調整したいときは、回帰モデル(重回帰・ロジスティック回帰・Cox回帰)で調整します。年齢構成をそろえる**標準化**も古典的な調整法です。"}},
 {box:{t:"調整しすぎにも注意",c:R,b:"曝露の結果として生じた中間因子まで調整すると、本当の効果を消してしまいます(過剰調整)。何を調整し何を調整しないかは、統計ではなく因果構造の問題です。"}},
 {eg:"「年齢が交絡と考えられたため、Mantel-Haenszel法で年齢層別に統合したオッズ比を報告した(粗OR 1.8 → 調整OR 1.2)。」"}
]},
{t:"15. 生存時間解析の基礎",b:[
 {p:"『イベントが起きるまでの時間』を扱うのが生存時間解析です。死亡・再発・退院などが対象で、単なる発生割合と違い、いつ起きたかと、最後まで観察できなかった例をどう扱うかが鍵になります。"},
 {p:"その『最後まで分からない』が**打ち切り**です。観察終了時点で生存中、あるいは途中で来院しなくなった例。情報を捨てずに活かす点が、生存解析の工夫どころです。"},
 {fig:{n:"15-1",cap:"カプランマイヤー曲線。イベントが起きるたびに段差を下げる。曲線が右や上にあるほど予後が良い。2群の隔たりを検定するのがログランク検定。",html:"fKM"}},
 {p:"打ち切りを考慮して生存率を階段状に推定するのが**カプランマイヤー法**。2群以上の生存曲線の全体的な差を調べるのが**ログランク検定**です。"},
 {box:{t:"ハザードという見方",c:TL,b:"**ハザード**は『その瞬間に生き残っている人の中で、いまイベントが起きる勢い』。2群のハザードの比=**ハザード比**が、生存解析での効果の指標です(Cox回帰で求めます。詳細は上級編)。ハザード比0.7なら『どの時点でも危険が3割低い』という読み方になります。"}},
 {box:{t:"よくある誤り",c:R,b:"生存率の比較を、観察終了時点の一点だけで比べるのは情報の無駄遣い。曲線全体・中央生存期間・ハザード比で語ります。また打ち切りがイベントと関係する(脱落者ほど予後が悪いなど)と推定が歪むので、打ち切りの理由にも注意します。"}},
 {eg:"「無再発生存はKaplanMeier法で推定し、群間差はログランク検定で評価(p=0.01)。治療群のハザード比は0.62(95%CI 0.43〜0.89)であった。」"}
]},
{t:"16. 診断検査の評価",b:[
 {p:"新しい検査やバイオマーカーが『使えるか』を測る指標を整理します。出発点は、検査結果(陽性/陰性)と真の病気(あり/なし)の2×2表です。"},
 {rows:[
  ["感度","病気の人を正しく陽性にできる割合。高いほど見逃しが少ない。"],
  ["特異度","健康な人を正しく陰性にできる割合。高いほど過剰診断が少ない。"],
  ["陽性的中率","陽性者のうち本当に病気の割合。有病率に強く依存する。"],
  ["陰性的中率","陰性者のうち本当に健康の割合。"]
 ]},
 {p:"**感度**と**特異度**は検査固有の性質ですが、**陽性的中率**は有病率しだいで大きく変わります。まれな病気では、感度・特異度が高くても陽性のほとんどが偽陽性、ということが起こります。"},
 {fig:{n:"16-1",cap:"ROC曲線。判定の閾値を動かすと、感度(縦)と偽陽性率(横)が連動して変わる。曲線が左上に張り出すほど性能が高く、その面積がAUC。",html:"fROC"}},
 {p:"閾値を緩めれば感度は上がるが特異度は下がる——このトレードオフをすべての閾値で描いたのが**ROC曲線**です。曲線下の面積**AUC**(0.5で偶然、1で完全)が、総合的な判別性能の要約になります。"},
 {box:{t:"有病率の効果",c:R,b:"同じ検査でも、有病率の低い集団(健診など)に使うと陽性的中率は激減します。『感度95%・特異度95%でも、有病率1%なら陽性の8割超が偽陽性』というのは、スクリーニングを考える上での要点です。"}},
 {box:{t:"閾値とAUCの使い分け",c:TL,b:"AUCは閾値に依存しない総合指標ですが、実臨床では『どの閾値で使うか』が本質。見逃しが致命的なら感度寄り、確定診断なら特異度寄りに閾値を選びます。目的次第で最適点は変わります。"}},
 {eg:"「新規マーカーのAUCは0.84(95%CI 0.79〜0.89)。閾値を◯◯とすると感度88%・特異度71%であった。」"}
]},
{t:"17. 重回帰と交互作用",b:[
 {p:"単回帰は説明変数が1つだけでした。しかし現実では、年齢・性別・重症度など複数の要因が同時にアウトカムに効きます。これらをまとめて1本の式で扱うのが重回帰です。"},
 {p:"重回帰の係数(偏回帰係数)は、『他の変数を一定に保ったときの、その変数だけの純粋な効果』を表します。これが観察研究で交絡を統計的に調整する基本の仕組みです。"},
 {formula:"y = b0 + b1·x1 + b2·x2 + … + bk·xk\n  各 b は『他を固定したときの、その変数1単位あたりの効果』"},
 {fig:{n:"17-1",cap:"交互作用のある例。同じxでも、群A(青)では効果が大きく群B(緑)では小さい。傾きが群で違うとき、両者を1本の直線で語れない。",html:"fMReg"}},
 {p:"重要な概念が**交互作用**です。これは『ある要因の効果が、別の要因の値によって変わる』こと(効果の修飾)。たとえば、ある薬が若年者には効くが高齢者には効かない、という状況です。交互作用があるのに無視すると、平均化された誤った結論になります。"},
 {box:{t:"入れすぎの危険",c:R,b:"変数を増やすほど当てはまりは良く見えますが、過剰適合(偶然のパターンまで学習)に陥ります。目安として、連続アウトカムなら1変数あたり10〜15例、二値なら『少ない方のイベント10件あたり1変数』が経験則です。"}},
 {box:{t:"多重共線性",c:TL,b:"**多重共線性**は、説明変数どうしが強く相関している状態。係数が不安定になり符号が反転することも。似た変数(身長と体重とBMIなど)を全部入れない、VIFで確認する、といった対処をします。"}},
 {eg:"「年齢・性別・BMIを調整した重回帰で、曝露はHbA1cを0.21%上昇させた(調整後 β=0.21, 95%CI 0.09〜0.33)。年齢との交互作用は有意でなかった。」"}
]},
{t:"18. 研究デザインとバイアス",b:[
 {p:"どんな高度な解析も、データの取り方=研究デザインが弱ければ結論は揺らぎます。手法を学ぶ前に、デザインが結論の強さ(エビデンスレベル)を決めることを押さえます。"},
 {rows:[
  ["ランダム化比較試験","対象を無作為に群分け。交絡を平均的にそろえられ、因果推論に最も強い。"],
  ["コホート研究","曝露あり/なしを追跡し将来の発症を比較(前向き)。"],
  ["症例対照研究","発症者と非発症者で過去の曝露を比較(後ろ向き、まれな疾患に有効)。"],
  ["横断研究","ある一時点で曝露と結果を同時に観察。因果の前後は不明。"]
 ]},
 {fig:{n:"18-1",cap:"時間の向きの違い。コホートは曝露から結果へ前向きに、症例対照は結果から過去の曝露へさかのぼる。横断は同時点。",html:"fDesign"}},
 {p:"観察研究では各種の**バイアス**(系統誤差)が脅威です。対象の選ばれ方が偏る**選択バイアス**、測定や分類の誤りによる**情報バイアス**、患者が病気の有無で過去を違って思い出す**思い出しバイアス**などがあります。"},
 {box:{t:"なぜRCTが強いのか",c:TL,b:"**ランダム化比較試験**では、測定できない交絡因子まで含めて、群間で平均的に均等に分かれます。だから群間の差を治療の効果と解釈できる。これは層別や回帰による事後調整(測定した因子しか調整できない)との決定的な違いです。"}},
 {box:{t:"バイアスは解析で消せない",c:R,b:"交絡は層別・回帰である程度調整できますが、選択・情報バイアスは原則あとから補正できません。よいデザイン(盲検化・標準化された測定・適切な対照)で予防するのが本筋です。"}},
 {eg:"「後ろ向き症例対照研究のため思い出しバイアスの可能性があり、結果は仮説生成的なものと位置づけた。」"}
]},
{t:"19. 効果量とその指標",b:[
 {p:"p値は『差があるか』しか答えません。臨床判断に必要なのは『どれだけ差があるか』——すなわち**効果量**です。"},
 {fig:{n:"19-1",cap:"連続量の効果量(Cohenのd)。2群の平均差を標準偏差で割った値。分布の重なりが小さいほどdは大きく、効果が際立つ。",html:"fEffect"}},
 {rows:[
  ["Cohenのd","連続量の標準化された平均差。0.2=小、0.5=中、0.8=大が目安。"],
  ["リスク比","発症割合の比(RR)。2なら2倍起こりやすい、という相対指標。"],
  ["オッズ比","オッズの比(OR)。症例対照やロジスティック回帰の効果指標。"],
  ["絶対リスク減少","発症割合の差(ARR)。実際に何%減ったかという絶対指標。"],
  ["治療必要数","NNT=1÷ARR。1人の発症を防ぐのに必要な治療人数。"]
 ]},
 {formula:"治療必要数 NNT = 1 / 絶対リスク減少(ARR)\n  例) ARR=0.05(5%)なら NNT=20"},
 {box:{t:"相対指標の見かけのマジック",c:R,b:"『**リスク比**で50%減』は劇的に聞こえますが、もとが2%→1%なら**絶対リスク減少**はわずか1%(NNT=100)。相対指標だけだと効果を過大に感じます。必ず絶対指標を併記して判断します。"}},
 {box:{t:"統計的有意と臨床的有意",c:TL,b:"大標本では、臨床的に無意味なほど小さな差でもp<0.05になります。逆に小標本では、意味のある差でも有意にならないことが。p値ではなく効果量と信頼区間で『意味のある大きさか』を語るのが正道です。"}},
 {eg:"「治療により1年再発リスクが12%から8%へ低下(ARR 4%, NNT 25, リスク比0.67)。」"}
]},
{t:"20. 測定の信頼性と一致度",b:[
 {p:"統計解析は測定値の上に立っています。測定そのものがぶれていれば、その上の検定や回帰は砂上の楼閣です。ここでは測定の質を測る2つの軸——再現性(信頼性)と正確さ(妥当性)——を扱います。"},
 {p:"連続量の再現性は、級内相関係数(ICC)で測ります。同じ対象を別の機会・別の評価者で測ったとき、値がどれだけ一致するか(0〜1、1で完全一致)を表します。"},
 {fig:{n:"20-1",cap:"2人の評価者の測定値。点が対角線(完全一致の線)に近いほど一致度が高く、ICCは1に近づく。系統的にずれると線から平行に外れる。",html:"fICC"}},
 {p:"カテゴリ判定(陽性/陰性、病期分類など)の一致には**κ係数**を使います。これは『偶然でも一致する分』を差し引いた、実質的な一致度の指標です(単純な一致率は偶然分を含むため過大評価になります)。"},
 {box:{t:"信頼性と妥当性は別物",c:TL,b:"信頼性(再現性)は『何度測っても同じ値が出るか』、妥当性は『真の値に近いか』。的当てに例えると、信頼性は弾のまとまり、妥当性は的の中心への近さ。まとまっていても(高信頼性)中心からずれていれば(低妥当性)役に立ちません。"}},
 {box:{t:"一致は相関ではない",c:R,b:"2つの測定の相関が高くても、一致しているとは限りません(片方が常に2倍でも相関は1)。一致を見るにはICCやκ、差を可視化するBland-Altman図を使い、相関係数で代用しないこと。"}},
 {eg:"「2名の読影医による病期分類の一致はκ=0.78(かなり良好)。連続値の腫瘍径測定はICC=0.91であった。」"}
]},
{t:"21. 欠測データの基礎",b:[
 {p:"現実の臨床データに欠測はつきものです。脱落・未測定・記入漏れ。これを軽く扱うと、結果が静かに歪みます。まず『なぜ欠けたのか』を分類することが出発点です。"},
 {fig:{n:"21-1",cap:"症例×変数の表。赤いマスが欠測。欠測が起きる仕組み(他の値や欠測値自身と関係するか)で、対処の難しさが変わる。",html:"fMiss"}},
 {rows:[
  ["MCAR","完全にランダムな欠測。欠けやすさが何とも無関係(理想的だがまれ)。"],
  ["MAR","観測済みの他変数で説明できる欠測。適切な手法で補正できる。"],
  ["MNAR","欠けた値自身に依存(重症ほど来院しないなど)。最も厄介。"]
 ]},
 {p:"よく使われる『欠測のある人を全員除く(完全例解析)』は、欠測が**MCAR**でない限りバイアスを生みます。また『平均値で埋める』のも、ばらつきを過小評価して標準誤差を不当に狭めるため危険です。"},
 {box:{t:"推奨される対処",c:TL,b:"現在の標準は**多重代入**。欠測を複数通り(例:20セット)もっともらしく埋めて各々を解析し、結果を統合することで、補完の不確かさも標準誤差に反映できます。最尤推定に基づく方法(混合モデルなど)も有力です。"}},
 {box:{t:"最良の対策は予防",c:R,b:"どんな高度な補完も、**MNAR**(欠測の理由が値そのもの)を完全には救えません。追跡の工夫で欠測自体を減らすこと、そして欠測の量と理由を論文に明記し、感度分析で頑健性を示すことが大切です。"}},
 {eg:"「主要解析は多重代入(20セット)で行い、完全例解析を感度分析として併記。結論は一致した。」"}
]},
{t:"22. 度数データと率の比較",b:[
 {p:"アウトカムが連続量(血圧など)ではなく『件数』や『発生率』のとき、平均ベースの手法ではうまくいきません。感染件数・再入院回数・発作回数などがこれにあたります。"},
 {p:"とくに観察期間が人によって違うとき、単純な発生割合では不公平です。長く追った人ほどイベントが起きやすいからです。そこで分母に**人年**(観察人数×追跡時間)を使い、単位時間あたりの発生率で比べます。2群の率の比が**率比**(IRR)です。"},
 {fig:{n:"22-1",cap:"各人の追跡期間(横棒)。長さの合計が総人年。×がイベント。率は『イベント数÷総人年』で、追跡の長短を公平に扱える。",html:"fRate"}},
 {formula:"発生率 = イベント数 / 総人年\n率比(IRR) = 群Aの発生率 / 群Bの発生率"},
 {p:"件数データの土台は**ポアソン分布**(第4章)です。これを使って率を比べるのがポアソン回帰で、率比という解釈しやすい指標が得られます。"},
 {box:{t:"過分散に注意",c:R,b:"現実の件数は、ポアソンが仮定するより大きくばらつくことがよくあります(**過分散**)。これを放置すると標準誤差を過小評価し、p値が不当に小さくなります。負の二項分布やロバスト標準誤差で対処します。"}},
 {box:{t:"生存解析との近さ",c:TL,b:"率が一定なら、それは生存解析のハザードが一定という仮定に対応します。『時間あたりの起こりやすさ』を扱う点で、率の解析と生存解析は親戚です。"}},
 {eg:"「感染率は介入群2.1/100人年、対照群3.6/100人年(率比0.58, 95%CI 0.39〜0.87)。過分散のため負の二項回帰を用いた。」"}
]},
{t:"23. ブートストラップ ― 数式に頼らず不確かさを測る",b:[
 {p:"これまでの信頼区間は『正規分布』や数式の近似に頼ってきました。しかし中央値・相関係数・AUC・補正済みの複雑な指標などは、きれいな数式がない、あるいは近似が怪しいことがあります。そんなときの万能選手が**ブートストラップ**です。"},
 {p:"発想はとても素朴です。手元の標本を『小さな母集団』とみなし、そこから**リサンプリング**(同じ人数を復元抽出=同じ人を何度選んでもよい抽出)を何千回も行う。そのたびに統計量を計算すれば、その散らばりが、そのまま推定の不確かさの見積もりになります。"},
 {fig:{n:"23-1",cap:"復元抽出を数千回繰り返して得た統計量の分布。並べたものの中央2.5%〜97.5%点(赤)を取れば、それが95%信頼区間になる。",html:"fBoot"}},
 {formula:"1) 元データからn個を復元抽出する\n2) 関心のある統計量を計算する\n3) 1〜2を数千回くり返す\n4) 並べた分布の2.5%点〜97.5%点が95%区間"},
 {box:{t:"強み",c:TL,b:"分布の仮定がほとんど要りません。中央値・四分位範囲・AUC・2つの指標の差など、数式での標準誤差が面倒な量にも、同じ手順がそのまま使えます。**リサンプリング**は交差検証など他の場面にも通じる考え方です。"}},
 {box:{t:"限界",c:R,b:"元の標本が偏っていれば、その偏りは直りません(偏った標本から正しい母集団は復元できない)。また標本が極端に小さいと結果が不安定になります。万能ではなく、あくまで『手元のデータが母集団を代表している』前提の上の手法です。"}},
 {eg:"「中央値の差の95%信頼区間は、正規近似が困難なためブートストラップ(2000反復)で算出した。」"}
]},
{t:"24. 回帰診断 ― あてはめを鵜呑みにしない",b:[
 {p:"回帰は『当てはめて係数を読んで終わり』ではありません。前提が崩れていないか、結果を歪める点はないかを点検する——これが回帰診断です。主役は、各点と予測値のズレである**残差**です。"},
 {fig:{n:"24-1",cap:"残差プロット(横=予測値, 縦=残差)。左:点が0の周りに無秩序に散らばる=良好。右:扇状に広がる=ばらつきが一定でない(不等分散)で要対処。",html:"fResid"}},
 {p:"残差プロットで点が0の周りにランダムに散らばっていれば良好です。曲がり(直線では捉えきれない非線形の見落とし)や、扇状の広がり(分散が一定でない=不等分散)といった『模様』が見えたら、モデルを見直す合図です。"},
 {rows:[
  ["線形性","残差に系統的な曲がりがないか(あれば変換や項追加)。"],
  ["等分散性","残差の広がりが予測値によらず一定か(扇形は危険)。"],
  ["正規性","残差のヒストグラムやQQプロットが正規に近いか。"],
  ["独立性","時系列なら残差の自己相関がないか。"],
  ["外れ値・てこ比","1点で結論を動かす極端な点がないか。"]
 ]},
 {box:{t:"てこ比と影響点",c:TL,b:"xが極端な点は**てこ比**(レバレッジ)が高く、たった1点で回帰直線を大きく動かしかねません。Cookの距離などで影響の大きい点を特定し、その点を除いても結論が変わらないか(感度分析)を確認します。"}},
 {box:{t:"崩れていたときの一手",c:R,b:"非線形なら変数変換や項の追加(第25章)、不等分散ならロバスト標準誤差や重み付き回帰、外れ値なら入力ミスの確認とロバスト回帰。診断で終わらせず、必ず次の対処につなげます。"}},
 {eg:"「残差プロットで軽度の不等分散を認めたため、頑健標準誤差を用いて係数の信頼区間を再計算した。」"}
]},
{t:"25. 変数変換と非線形の扱い",b:[
 {p:"関係はいつも直線とは限りません。直線の仮定が崩れているのに普通の回帰を当てると、誤った結論を出します。ここでは、曲がった関係や歪んだ分布への対処をまとめます。"},
 {p:"最も基本が**対数変換**です。右に長い裾を引く量(多くの検査値・医療費・在院日数)は、対数をとると分布が対称に近づき、平均ベースの手法が使えるようになります。係数も『1単位増えると◯%変化』と、割合で解釈しやすくなる利点があります。"},
 {fig:{n:"25-1",cap:"右に歪んだ元データ(金)も、対数変換すると対称な釣鐘型(青)に近づく。これで正規を前提とする手法が適用しやすくなる。",html:"fTrans"}},
 {rows:[
  ["対数変換","右歪みの是正。係数を割合的に解釈できる。"],
  ["平方根変換","件数データのばらつきを安定させる。"],
  ["多項式(x²項)","曲線的な関係を表す。端で暴れやすい。"],
  ["平滑化スプライン","形を決めつけず滑らかな曲線で柔軟に表す。"],
  ["カテゴリ化","扱いは楽だが情報を捨て、見せかけの閾値を作る。"]
 ]},
 {box:{t:"安易な2分割をやめる",c:R,b:"連続変数を中央値で『高い/低い』に切ると、情報を大きく捨て、存在しない閾値をでっち上げてしまいます。代わりに**平滑化スプライン**を使えば、関係の形を決めつけずに滑らかな曲線として描けます。"}},
 {box:{t:"変換の代償",c:TL,b:"変換後の平均は、元の単位の平均とは一致しません(対数の平均は幾何平均に対応)。結果を元の単位に戻すときの解釈と、逆変換の扱いに注意が必要です。"}},
 {eg:"「CRPは右に強く歪むため対数変換して解析し、結果は幾何平均比として報告した。年齢は平滑化スプラインでモデル化した。」"}
]},
{t:"26. 率の標準化 ― 年齢構成の違う集団を比べる",b:[
 {p:"A市とB市の死亡率(**粗率**＝単純に死亡数÷人口)を比べたら、医療の充実したA市のほうが高かった——地域比較でよくある「逆説」です。原因の多くは**年齢構成**。高齢者の多い集団は、医療水準と無関係に死亡率が高く出ます。年齢はここで典型的な交絡因子(第14章)であり、それをそろえる古典的な道具が**標準化**です。"},
 {fig:{n:"26-1",cap:"粗率ではA市が高く見えるが、年齢構成をそろえる(標準化する)と差はほぼ消える。粗率の比較は、実は「年齢構成の比較」になってしまっていた。",html:"fStdz"}},
 {p:"**直接法**は、基準となる人口構成(**標準人口**)を1つ決め、『もし両市の年齢構成が標準人口と同じだったら死亡率はいくつか』という仮想の率を計算して比べます。年齢階級ごとの率に、標準人口に占めるその階級の割合を重みとして掛けて足し合わせるだけです。"},
 {formula:"直接法:  調整率 = Σ( 各年齢階級の率 × 標準人口に占めるその階級の割合 )\n間接法:  SMR = 観測死亡数 ÷ 期待死亡数\n  (期待死亡数 = 基準集団の年齢別率を対象集団の人口構成に当てはめて計算)"},
 {p:"**間接法**は逆向きの発想です。基準集団(例:全国)の年齢別死亡率を対象集団に当てはめて『この年齢構成なら期待される死亡数』を計算し、実際の死亡数との比をとります。これが**SMR**(標準化死亡比)。1.4なら「全国並みと比べて4割多い」、0.8なら「2割少ない」と読みます。職業コホートの健康評価などで頻用されます。"},
 {box:{t:"直接法と間接法の使い分け",c:TL,b:"直接法は、年齢階級ごとの率が安定して推定できる、ある程度大きな集団向き。小さな集団では階級別の率が数人の偶然で大きく暴れるため、死亡数の合計だけで計算できる間接法(SMR)のほうが安定します。"}},
 {box:{t:"注意点",c:R,b:"・調整率の絶対値は標準人口の選び方で変わる**人工的な値**で、実在の率ではありません。意味があるのは比較だけ。\n・異なる標準人口で計算した調整率どうしは比較できません(日本では基準人口の改定で値が大きく変わった経緯があります)。\n・SMRどうしの厳密な比較も本来は要注意。各集団が「自分の年齢構成」を重みにしているため、構成が大きく違う集団間では条件がそろいません。"}},
 {eg:"「死亡率は平成27年モデル人口を標準人口とする直接法で年齢調整した。職業コホートの全死因SMRは0.82(95%CI 0.74–0.91)と一般人口より低く、healthy worker効果が示唆された。」"}
]}
];

/* ===== render ===== */
let cur=0;
function wireGloss(){document.querySelectorAll("#art .gl").forEach(function(el){el.onclick=function(){if(el._d){el._d.remove();el._d=null;return;}var s=document.createElement("span");s.className="gldef";s.textContent="▸ "+el.getAttribute("data-d");el.after(s);el._d=s;};});}
function render(){
  const nav=document.getElementById("nav");
  nav.innerHTML=CH.map((c,i)=>`<button class="tab${i===cur?' on':''}" data-i="${i}">${c.t.split(".")[0]}</button>`).join("");
  nav.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render();window.scrollTo(0,0);});
  document.getElementById("art").innerHTML=`<h2>${CH[cur].t}</h2><div class="uline"></div>`+CH[cur].b.map(block).join("");
  wireGloss();
  document.getElementById("pg").textContent=(cur+1)+" / "+CH.length;
  document.getElementById("prev").disabled=cur===0;
  document.getElementById("next").disabled=cur===CH.length-1;
}
document.getElementById("prev").onclick=()=>{if(cur>0){cur--;render();window.scrollTo(0,0);}};
document.getElementById("next").onclick=()=>{if(cur<CH.length-1){cur++;render();window.scrollTo(0,0);}};
render();
</script>
</body>
